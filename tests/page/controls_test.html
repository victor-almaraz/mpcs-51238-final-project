<!doctype html>
<!-- espresso-ui.js in a browser (ui.md §7.2): each control against a fake
     espresso, driven by synthetic pointer and key events. Run by ctest
     with Chrome's --headless --dump-dom; the result is the text of
     #result: the verdict "ok" or "FAIL" after "controls", then what
     failed. -->
<html>
<head><meta charset="utf-8"><title>espresso-ui.js test</title></head>
<body>
<pre id="result">not run</pre>
<script>
  // A fake of /espresso.js: sends are recorded, and the test plays the
  // piece's messages and the socket's opens.
  const sent = [];
  const handlers = new Map();
  const openers = [];
  let open = false;
  globalThis.espresso = {
    dropped: 0,
    send(address, ...args) { sent.push([address, ...args]); return open; },
    on(address, fn) { if (!handlers.has(address)) handlers.set(address, []); handlers.get(address).push(fn); },
    onOpen(fn) { openers.push(fn); if (open) fn(); },
  };
  globalThis.fake = {
    receive(address, ...args) { for (const fn of handlers.get(address) || []) fn(...args); },
    open() { open = true; for (const fn of openers) fn(); },
  };
</script>
<script src="../../src/apps/server/espresso-ui.js"></script>
<es-knob id="cutoff" address="/cutoff" label="Cutoff" min="20" max="20000" scale="exp" value="800" unit="hz"></es-knob>
<es-knob id="range" address="/range" label="Range" steps="3" options="LO,MID,HI"></es-knob>
<es-slider id="level" address="/level" label="Level" min="0" max="1" value="0.5"></es-slider>
<es-slider id="tall" address="/tall" orientation="vertical"></es-slider>
<es-toggle id="power" address="/power" label="Power" value="1"></es-toggle>
<es-button id="hit" address="/hit">Hit</es-button>
<es-select id="wave" address="/wave" label="Wave">
  <option>Sine</option><option selected>Saw</option><option>Square</option>
</es-select>
<es-meter id="meter" address="/meter" label="Level"></es-meter>
<es-meter id="quick" address="/quick" hold="0" max="0.25" orientation="vertical"></es-meter>
<es-lamp id="overload" address="/overload" label="Overload"></es-lamp>
<es-value id="frequency" address="/frequency" label="Frequency" unit="hz"></es-value>
<es-keys id="keys" low="48" high="59" style="width: 420px"></es-keys>
<es-keys id="soft" address="/soft" low="60" high="64" velocity="40"></es-keys>
<es-xy id="pad" address="/xy" label="Pad" value="0.5,0.5"></es-xy>
<es-knob id="stops" address="/stops" label="Stops" angles="-73,-44,-14,13,45,73" value="2"></es-knob>
<es-knob id="wide" address="/wide" sweep="150" value="1"></es-knob>
<es-knob id="octave" address="/octave" min="-2" max="2" step="1" value="0" options="32′,16′,8′,4′,2′"></es-knob>
<es-knob id="custom" address="/custom" scale="square" unit="cents" value="0.25"></es-knob>
<es-toggle id="long" address="/long" value="1" style="--es-toggle-length: 56px; --es-toggle-thickness: 22px; --es-toggle-inset: 3px"></es-toggle>
<script>
  // A unit and a scale added after the controls, as a page's own script
  // does: the controls take them, since they set up once the page is parsed.
  espressoUI.units.cents = (v) => Math.round(v * 100) + " cents";
  espressoUI.scales.square = { value: (p, lo, hi) => lo + p * p * (hi - lo),
                               position: (v, lo, hi) => Math.sqrt((v - lo) / (hi - lo)) };
  const failures = [];
  const expect = (what, ok) => { if (!ok) failures.push(what); };
  const near = (a, b) => Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(b));
  const control = (id) => document.getElementById(id).shadowRoot.querySelector(".control");
  const key = (id, k) => control(id).dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true }));
  const pointer = (id, type, x, y, shiftKey = false) =>
    control(id).dispatchEvent(new PointerEvent(type, { pointerId: 1, clientX: x, clientY: y, shiftKey, bubbles: true }));
  const last = () => sent[sent.length - 1];

  document.addEventListener("DOMContentLoaded", async () => {
  try {
    const cutoff = document.getElementById("cutoff");
    expect("a knob starts at its value", cutoff.value === 800);
    expect("nothing is sent before the user acts or the socket opens", sent.length === 0);
    const c = control("cutoff");
    expect("a knob is a slider to assistive technology", c.getAttribute("role") === "slider" && c.getAttribute("tabindex") === "0");
    expect("its label names it", c.getAttribute("aria-label") === "Cutoff");
    expect("its value reads in its unit", c.getAttribute("aria-valuetext") === "800 Hz");

    // A value from the piece is shown, and not sent back.
    let events = [];
    cutoff.addEventListener("input", (e) => events.push(e.detail));
    fake.receive("/cutoff", 1000);
    expect("a received value is shown", cutoff.value === 1000 && c.getAttribute("aria-valuenow") === "1000");
    expect("a received value is not sent", sent.length === 0);
    expect("a received value fires input, not from the page", events.length === 1 && events[0].fromPage === false);
    fake.receive("/cutoff", "loud");
    expect("a value that is not a number is ignored", cutoff.value === 1000);

    // Keys move it by 1%, Page Up and Down by 10%, Home and End to the ends.
    const before = cutoff.value;
    key("cutoff", "ArrowUp");
    expect("an arrow key sends a higher value", sent.length === 1 && last()[0] === "/cutoff" && last()[1] > before);
    key("cutoff", "Home");
    expect("Home sends the minimum", last()[1] === 20);
    key("cutoff", "End");
    expect("End sends the maximum", last()[1] === 20000);
    key("cutoff", "PageDown");
    expect("Page Down moves 10% of the travel", near(last()[1], 20 * Math.pow(1000, 0.9)));

    // A drag up raises it, 150 pixels for the whole travel; Shift is finer.
    key("cutoff", "Home");
    pointer("cutoff", "pointerdown", 0, 300);
    pointer("cutoff", "pointermove", 0, 225);
    expect("a drag of half the travel reaches the middle", near(cutoff.value, Math.sqrt(20 * 20000)));
    pointer("cutoff", "pointerup", 0, 225);
    const atMiddle = cutoff.value;
    pointer("cutoff", "pointerdown", 0, 300);
    pointer("cutoff", "pointermove", 0, 225, true);
    pointer("cutoff", "pointerup", 0, 225);
    expect("a Shift drag moves a tenth as far", near(cutoff.value, 20 * Math.pow(1000, 0.55)) && cutoff.value > atMiddle);
    const sends = sent.length;
    pointer("cutoff", "pointermove", 0, 0);
    expect("a move without a press does nothing", sent.length === sends);

    // A double click returns it to its value, and sends it.
    control("cutoff").dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
    expect("a double click resets to the value attribute", cutoff.value === 800 && last()[1] === 800);
    key("cutoff", "End");
    cutoff.reset();
    expect("reset() returns it to its value attribute and sends it", cutoff.value === 800 && last().join() === "/cutoff,800");

    // A selector of steps sends its index, and reads as its option.
    const range = document.getElementById("range");
    expect("a selector starts at its first step", range.value === 0);
    key("range", "ArrowUp");
    expect("a key moves a selector one step", range.value === 1 && last()[0] === "/range" && last()[1] === 1);
    expect("a selector reads as its option", control("range").getAttribute("aria-valuetext") === "MID");
    fake.receive("/range", 1.7);
    expect("a received step is rounded", range.value === 2);

    // A slider: a press puts it where the pointer is.
    const level = document.getElementById("level");
    control("level").focus();  // a press focuses it, which may scroll it into view
    const box = control("level").getBoundingClientRect();
    expect("a slider has a length", box.width > 50);
    pointer("level", "pointerdown", box.left + box.width * 0.25, box.top);
    expect("a press on a slider sends the value under it", near(level.value, 0.25) && last()[0] === "/level");
    pointer("level", "pointermove", box.left + box.width * 2, box.top);
    expect("a drag past the end stops at the maximum", level.value === 1);
    pointer("level", "pointerup", 0, 0);
    const tall = control("tall").getBoundingClientRect();
    expect("a vertical slider stands up", tall.height > tall.width);

    // A toggle flips on a click, Space, or Enter, and sends 1 or 0.
    const power = document.getElementById("power");
    const p = control("power");
    expect("a toggle is a switch", p.getAttribute("role") === "switch" && p.getAttribute("aria-label") === "Power");
    expect("a toggle starts at its value", power.value === 1 && p.getAttribute("aria-checked") === "true");
    p.click();
    expect("a click turns it off and sends 0", power.value === 0 && p.getAttribute("aria-checked") === "false" && last()[0] === "/power" && last()[1] === 0);
    key("power", " ");
    expect("Space turns it on", power.value === 1 && last()[1] === 1);
    key("power", "Enter");
    expect("Enter turns it off", power.value === 0 && last()[1] === 0);
    let toggles = sent.length;
    fake.receive("/power", 1);
    expect("a received state is shown and not sent", power.value === 1 && p.classList.contains("on") && sent.length === toggles);

    // A button sends 1 while held and 0 when let go.
    const h = control("hit");
    expect("a button is a button", h.getAttribute("role") === "button" && h.getAttribute("tabindex") === "0");
    pointer("hit", "pointerdown", 0, 0);
    expect("a press sends 1", last()[0] === "/hit" && last()[1] === 1 && h.classList.contains("down"));
    pointer("hit", "pointerup", 0, 0);
    expect("a release sends 0", last()[0] === "/hit" && last()[1] === 0);
    key("hit", " ");
    const held = sent.length;
    h.dispatchEvent(new KeyboardEvent("keydown", { key: " ", repeat: true, bubbles: true }));
    expect("a held key sends 1 once", last()[1] === 1 && sent.length === held);
    h.dispatchEvent(new KeyboardEvent("keyup", { key: " ", bubbles: true }));
    expect("letting go of the key sends 0", last()[1] === 0);

    // A select sends the index of its choice.
    const wave = document.getElementById("wave");
    const w = control("wave");
    expect("a select starts at its selected option", wave.value === 1 && w.selectedIndex === 1 && w.options.length === 3);
    w.selectedIndex = 2;
    w.dispatchEvent(new Event("change"));
    expect("a choice sends its index", wave.value === 2 && last()[0] === "/wave" && last()[1] === 2);
    toggles = sent.length;
    fake.receive("/wave", 0);
    expect("a received choice is shown and not sent", w.selectedIndex === 0 && sent.length === toggles);
    const late = document.createElement("es-select");
    late.setAttribute("value", "2");
    document.body.appendChild(late);
    for (const name of ["A", "B", "C"]) late.appendChild(new Option(name));
    await Promise.resolve();
    expect("options added after it connects are taken", late.shadowRoot.querySelector("select").options.length === 3 && late.value === 2);
    late.remove();

    // A meter shows what it receives, and holds its peak.
    const fill = (id) => parseFloat(document.getElementById(id).shadowRoot.querySelector(".fill").style[id === "quick" ? "height" : "width"]);
    const peak = (id) => parseFloat(document.getElementById(id).shadowRoot.querySelector(".peak").style[id === "quick" ? "bottom" : "left"]);
    const m = control("meter");
    expect("a meter is a meter", m.getAttribute("role") === "meter" && m.getAttribute("tabindex") === null);
    fake.receive("/meter", 0.8);
    fake.receive("/meter", 0.2);
    expect("a meter shows the last value", near(fill("meter"), 20) && m.getAttribute("aria-valuenow") === "0.2");
    expect("a meter holds the peak", near(peak("meter"), 80));
    fake.receive("/quick", 0.2);
    fake.receive("/quick", 0.125);
    expect("max scales a meter", near(fill("quick"), 50));
    expect("hold=\"0\" follows the value", near(peak("quick"), 50));

    // A lamp is lit by its value; .value sets it from the page.
    const lamp = document.getElementById("overload");
    const l = control("overload");
    expect("a lamp starts off", l.style.background === "" && l.getAttribute("aria-label") === "Overload, off");
    fake.receive("/overload", 1);
    expect("a lamp is lit by its value", l.style.background.includes("100%") && l.getAttribute("aria-label") === "Overload, on");
    lamp.value = 0;
    expect("the page can turn a lamp off", l.style.background === "");

    // A value reads in its unit, once it has one.
    const f = control("frequency");
    expect("a value is empty until one arrives", f.textContent === "");
    fake.receive("/frequency", 1500);
    expect("a value reads in its unit", f.textContent === "1.5 kHz");

    // A keyboard sends [/note, note, velocity] on a press and velocity 0 on
    // the release; each pointer holds one key and slides between keys.
    const keyOf = (id, n) => document.getElementById(id).shadowRoot.querySelector(`[data-note="${n}"]`);
    const centre = (id, n) => {
      keyOf(id, n).scrollIntoView({ block: "center" });  // hit tests see only the viewport
      const r = keyOf(id, n).getBoundingClientRect();
      return [r.left + r.width / 2, r.top + r.height * (n % 12 === 1 || n % 12 === 3 ? 0.3 : 0.85)];
    };
    const play = (id, type, n, pointerId = 1) => {
      const [x, y] = centre(id, n);
      control(id).dispatchEvent(new PointerEvent(type, { pointerId, clientX: x, clientY: y, bubbles: true }));
    };
    const notes = (from) => sent.slice(from).map((m) => m.join(" "));
    const k = control("keys");
    const keyboard = document.getElementById("keys").shadowRoot;
    expect("a keyboard has its range", keyboard.querySelectorAll(".key").length === 12 && keyboard.querySelectorAll(".black").length === 5);
    expect("a keyboard has its height", k.getBoundingClientRect().height > 50);
    expect("a keyboard is named by its range", k.getAttribute("aria-label") === "Keyboard, C3 to B3");
    let from = sent.length;
    play("keys", "pointerdown", 48);
    expect("a press sends a note on", notes(from).join() === "/note 48 100" && keyOf("keys", 48).classList.contains("down"));
    play("keys", "pointermove", 50);
    expect("a drag to another key moves the note", notes(from).join() === "/note 48 100,/note 48 0,/note 50 100");
    play("keys", "pointerdown", 49, 2);
    expect("a second pointer plays a black key", last().join(" ") === "/note 49 100");
    play("keys", "pointerdown", 50, 3);
    play("keys", "pointerup", 50, 3);
    expect("a key two pointers hold sounds once, until both let go", last().join(" ") === "/note 49 100" && keyOf("keys", 50).classList.contains("down"));
    play("keys", "pointerup", 50, 1);
    play("keys", "pointerup", 49, 2);
    expect("each release sends a note off", notes(from).slice(-2).join() === "/note 50 0,/note 49 0" && !keyOf("keys", 50).classList.contains("down"));
    from = sent.length;
    const type = (kind, code, repeat = false) => k.dispatchEvent(new KeyboardEvent(kind, { code, repeat, bubbles: true }));
    type("keydown", "KeyA");
    type("keydown", "KeyA", true);
    type("keyup", "KeyA");
    type("keydown", "KeyW");
    expect("the computer keyboard plays from the lowest C", notes(from).join() === "/note 48 100,/note 48 0,/note 49 100");
    k.dispatchEvent(new FocusEvent("blur"));
    expect("losing focus lets go of every key", last().join(" ") === "/note 49 0");
    type("keydown", "KeyX");
    from = sent.length;
    type("keydown", "KeyA");
    expect("X moves the keys an octave up, out of this range", sent.length === from);
    play("soft", "pointerdown", 62);
    play("soft", "pointerup", 62);
    expect("address and velocity are attributes", notes(sent.length - 2).join() === "/soft 62 40,/soft 62 0");

    // An xy pad sends two values, x then y; y rises upward.
    const pad = document.getElementById("pad");
    const xy = control("pad");
    expect("a pad starts at its value", pad.value.join() === "0.5,0.5");
    const touch = (kind, fx, fy) => {
      xy.scrollIntoView({ block: "center" });
      const square = xy.getBoundingClientRect();
      xy.dispatchEvent(new PointerEvent(kind, {
        pointerId: 1, clientX: square.left + square.width * fx, clientY: square.top + square.height * fy, bubbles: true }));
    };
    touch("pointerdown", 0.25, 0.25);
    expect("a press sends the point under it", last()[0] === "/xy" && near(last()[1], 0.25) && near(last()[2], 0.75));
    touch("pointermove", 2, 2);
    expect("a drag past the edge stops there", last()[1] === 1 && last()[2] === 0);
    touch("pointerup", 2, 2);
    from = sent.length;
    fake.receive("/xy", 0.1, 0.2);
    expect("a received point is shown and not sent", pad.value.join() === "0.1,0.2" && sent.length === from);
    key("pad", "ArrowUp");
    expect("an arrow key moves the point", near(last()[1], 0.1) && near(last()[2], 0.21));
    xy.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
    expect("a double click returns it to its value", last().slice(1).join() === "0.5,0.5");

    // A knob's travel: sweep degrees either side of the top, or a stop at
    // each of its angles.
    const turn = (id) => document.getElementById(id).shadowRoot.querySelector(".pointer").getAttribute("transform");
    expect("a knob of angles starts at its stop", document.getElementById("stops").value === 2 && turn("stops") === "rotate(-14.00 50 50)");
    key("stops", "ArrowUp");
    expect("a key moves it to the next stop", last().join() === "/stops,3" && turn("stops") === "rotate(13.00 50 50)");
    expect("sweep sets the travel", turn("wide") === "rotate(150.00 50 50)");
    expect("a stepped range reads as its options", control("octave").getAttribute("aria-valuetext") === "8′");
    key("octave", "ArrowUp");
    expect("a key moves a stepped range one step", last().join() === "/octave,1" && control("octave").getAttribute("aria-valuetext") === "4′");
    expect("a unit added after the controls is used", control("custom").getAttribute("aria-valuetext") === "25 cents");
    expect("a scale added after the controls is used", turn("custom") === "rotate(0.00 50 50)");

    // Part names, for a page's ::part() rules; a toggle's state is one.
    const pointerPart = document.getElementById("cutoff").shadowRoot.querySelector(".pointer").getAttribute("part");
    expect("a knob names its parts", pointerPart === "pointer" && control("cutoff").getAttribute("part") === "knob");
    const lt = control("long");
    const thumb = lt.querySelector(".thumb");
    expect("a toggle on names its state", lt.getAttribute("part") === "track on" && thumb.getAttribute("part") === "thumb on");
    const tr = lt.getBoundingClientRect();
    const th = thumb.getBoundingClientRect();
    expect("a toggle takes its size from custom properties", near(tr.width, 56) && near(tr.height, 22) && near(th.width, 16));
    expect("its thumb sits at the end while on", near(tr.right - th.right, 3));
    lt.click();
    expect("and at the start while off", near(thumb.getBoundingClientRect().left - tr.left, 3) && lt.getAttribute("part") === "track");

    // Each open sends the value of every control that sends one, so the
    // piece starts where the page is; buttons, keys, and displays send nothing.
    sent.length = 0;
    fake.open();
    const opened = new Map(sent.map(([a, v]) => [a, v]));
    expect("an open sends every value control", opened.size === 12 && sent.length === 12 && opened.get("/xy") === 0.5);
    expect("an open sends the current values",
           opened.get("/cutoff") === 800 && opened.get("/range") === 2 && opened.get("/level") === 1 &&
           opened.get("/power") === 1 && opened.get("/wave") === 0);
    sent.length = 0;
    fake.open();
    expect("a reconnect sends them again", sent.length === 12);
  } catch (error) {
    failures.push("threw " + error);
  }
  // Joined here so that neither verdict appears in the page's source,
  // which --dump-dom prints with the result.
  const verdict = ["controls", failures.length === 0 ? "ok" : "FAIL"].join(": ");
  document.getElementById("result").textContent = [verdict, ...failures].join("\n");
  });
</script>
</body>
</html>
