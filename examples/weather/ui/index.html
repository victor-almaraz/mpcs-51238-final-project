<!doctype html>
<!-- weather's page: the synthesizer's panel. Chicago now: the temperature
     and the wind as the piece glides to them, each on its scale. Tone: the
     volume of the sine and triangle, and the pitch the temperature gives
     them. Output: the wind's level and the output's level. Each control
     starts at the value the piece gives its osc-in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weather</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; background: radial-gradient(circle at 50% 30%, #262422, #121110 70%);
    font: 13px/1.3 system-ui, sans-serif; color: #ece7dc;
  }

  /* The synth kit: a panel between walnut cheeks. */
  .synth {
    --hue: #f2a65a;
    display: grid; grid-template-columns: 26px auto 26px; border-radius: 8px; box-shadow: 0 28px 70px #000d;
  }
  .cheek { background: linear-gradient(90deg, #4a2c18, #7b4d2c 35%, #5c371e 70%, #3b2313); }
  .cheek:first-child { border-radius: 8px 0 0 8px; }
  .cheek:last-child { border-radius: 0 8px 8px 0; }
  .panel {
    padding: 18px 26px 24px; background: linear-gradient(#34322f, #24231f);
    box-shadow: inset 0 1px 0 #ffffff22, inset 0 -2px 0 #00000055;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
         padding-bottom: 12px; margin-bottom: 18px; border-bottom: 1px solid #ffffff1c; }
  .model { font: 800 24px/1 system-ui, sans-serif; letter-spacing: 0.24em; }
  .model span { color: var(--hue); }
  .maker { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #a39c8f; text-transform: uppercase; }
  .sections { display: flex; align-items: stretch; }
  .sections section { padding: 0 22px; border-left: 1px solid #ffffff14; display: grid; align-content: start; gap: 14px; }
  .sections section:first-child { padding-left: 0; border-left: 0; }
  .sections section:last-child { padding-right: 0; }
  h2 { margin: 0; font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.28em; color: var(--hue); text-transform: uppercase; }
  .synth es-knob {
    --es-knob-size: 58px; --es-accent: var(--hue); --es-surface: #1b1a18; --es-line: #4d4a45;
    --es-text: #ece7dc; --es-muted: #a39c8f; --es-font: 600 10px/1.3 system-ui, sans-serif;
    text-align: center; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .synth es-knob.big { --es-knob-size: 84px; }
  .synth es-knob::part(body) { fill: url(#knob); stroke: #000; stroke-width: 2; }
  .synth es-knob::part(pointer) { stroke: #f4efe4; }
  .synth es-knob::part(value) { color: #ece7dc; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .synth es-meter {
    --es-accent: var(--hue); --es-surface: #121110; --es-line: #4d4a45; --es-text: #f4efe4; --es-muted: #a39c8f;
    --es-meter-length: 120px; --es-meter-thickness: 8px; --es-font: 600 10px/1.3 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  /* The screen: the temperature and the wind, each with a scale and a
     marker at the reading. */
  .screen { box-sizing: border-box; width: 300px; padding: 12px 14px; border-radius: 4px; background: #17100a;
            box-shadow: inset 0 0 0 1px #000, inset 0 0 18px #f2a65a22; color: #fbe2c6;
            display: grid; gap: 12px; font-variant-numeric: tabular-nums; }
  .reading { display: grid; grid-template-columns: 1fr auto; align-items: baseline; row-gap: 6px; }
  .reading .what { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.2em; color: #c39467; text-transform: uppercase; }
  .reading .now { font: 300 28px/1 system-ui, sans-serif; }
  .reading .now small { font: 500 12px/1 system-ui, sans-serif; color: #c39467; margin-left: 4px; }
  .scale { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 3px; background: #ffffff14; }
  .scale.warm { background: linear-gradient(90deg, #5aa0e6, #e9d8a6 55%, #f07a3a); }
  .scale i { position: absolute; top: -3px; width: 2px; height: 12px; margin-left: -1px; background: #fff;
             box-shadow: 0 0 6px var(--hue); transition: left 200ms linear; }
  .ends { grid-column: 1 / -1; display: flex; justify-content: space-between; font: 500 9px/1 system-ui, sans-serif;
          color: #8f6c4c; letter-spacing: 0.06em; }
  .readout { display: grid; justify-items: center; gap: 4px; font: 600 10px/1.3 system-ui, sans-serif;
             letter-spacing: 0.08em; text-transform: uppercase; color: #a39c8f; }
  .readout b { font: 500 13px/1.2 system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: #ece7dc;
               font-variant-numeric: tabular-nums; }
  .status { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #8a857c; font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
  <defs><radialGradient id="knob" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#55524c"/><stop offset="0.6" stop-color="#2a2825"/><stop offset="1" stop-color="#151412"/>
  </radialGradient></defs>
</svg>
<main class="synth" aria-label="weather">
  <div class="cheek" aria-hidden="true"></div>
  <div class="panel">
    <header class="top">
      <div class="model">LAKE<span>EFFECT</span></div>
      <div class="maker">Chicago weather drone · Open-Meteo</div>
    </header>
    <div class="sections">
      <section aria-label="Chicago now">
        <h2>Chicago now</h2>
        <div class="screen" role="group" aria-label="Weather">
          <div class="reading">
            <span class="what">Temperature</span><span class="now"><span id="temp">–</span><small>°C</small></span>
            <div class="scale warm"><i id="temp-mark"></i></div>
            <div class="ends"><span>−20</span><span>40 °C</span></div>
          </div>
          <div class="reading">
            <span class="what">Wind</span><span class="now"><span id="wind">–</span><small>km/h</small></span>
            <div class="scale"><i id="wind-mark"></i></div>
            <div class="ends"><span>calm</span><span>60 km/h</span></div>
          </div>
        </div>
      </section>
      <section aria-label="Tone">
        <h2>Tone</h2>
        <es-knob class="big" address="/volume" label="Volume" min="0" max="1" scale="db" value="0.1259" unit="db"></es-knob>
        <div class="readout">Pitch<b id="pitch">–</b></div>
      </section>
      <section aria-label="Output">
        <h2>Output</h2>
        <es-meter id="gust" label="Wind" max="0.8" hold="0"></es-meter>
        <es-meter address="/level" label="Level" max="0.5"></es-meter>
      </section>
    </div>
  </div>
  <div class="cheek" aria-hidden="true"></div>
</main>
<p class="status" id="status" role="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  const clamp = (x, lo, hi) => Math.min(Math.max(x, lo), hi);
  const mark = (id, p) => { document.getElementById(id).style.left = `${100 * clamp(p, 0, 1)}%`; };
  // The temperature, and the sine's pitch it gives: 110 Hz at -20 degrees,
  // doubling every 20 degrees.
  espresso.on("/temperature", (t) => {
    document.getElementById("temp").textContent = t.toFixed(1).replace("-", "−");
    mark("temp-mark", (t + 20) / 60);
    document.getElementById("pitch").textContent = espressoUI.format(110 * 8 ** ((clamp(t, -20, 40) + 20) / 60), "hz");
  });
  // The wind, and the noise's level it gives: 0 when calm to 0.8 at 60 km/h.
  const gust = document.getElementById("gust");
  espresso.on("/wind", (w) => {
    document.getElementById("wind").textContent = w.toFixed(1);
    mark("wind-mark", w / 60);
    gust.value = clamp((w / 60) * 0.8, 0, 0.8);
  });
  mark("temp-mark", 1 / 3);
  mark("wind-mark", 0);
  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
