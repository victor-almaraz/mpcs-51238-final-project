<!doctype html>
<!-- spectral-audioscape's page: a pedalboard of the piece's chain, in the
     order of its signal. Loop: the head's speed through the arpeggio, as a
     multiple of its own. Spectral delay: a feedback slider for each of the
     eight bands, under its delay time, and the bands' Q and damping. Freeze:
     the chance of the coin that turns it on or off every 16 beats, and a
     footswitch that holds it as the coin does; the LED is lit while either
     holds it. Reverb: its mix and tone. Out: the volume and the level; the
     delay's and the reverb's LEDs glow with the level. Each control starts
     at the value the piece gives its osc-in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spectral-audioscape</title>
<style>
  /* The pedal kit: stompboxes on a pedalboard. */
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, #2a2a2c, #141416 70%);
    font: 13px/1.3 system-ui, sans-serif; color: #e8e8e8;
  }
  .board {
    display: flex; align-items: stretch; gap: 26px; padding: 32px 34px; border-radius: 12px;
    background: repeating-linear-gradient(90deg, #1d1d1f 0 3px, #202022 3px 6px);
    box-shadow: inset 0 0 0 1px #ffffff0d, 0 24px 60px #000c;
  }
  .pedal {
    --paint: #3f8fb8; --paint-light: #6fc1e6; --paint-dark: #1f5c7c; --ink: #0d2a38;
    position: relative; width: 176px; padding: 22px 18px 26px; border-radius: 16px; box-sizing: border-box;
    display: grid; justify-items: center; align-content: space-between; gap: 14px;
    background: linear-gradient(160deg, var(--paint-light), var(--paint) 40%, var(--paint-dark));
    box-shadow: inset 0 2px 0 #ffffff55, inset 0 -4px 0 #00000066, 0 14px 26px #000000aa;
  }
  .pedal.loop { --paint: #d98a2b; --paint-light: #f5b462; --paint-dark: #9a5814; --ink: #3a1e04; width: 148px; }
  .pedal.delay { --paint: #2f8f7c; --paint-light: #5cc4ae; --paint-dark: #17594c; --ink: #072a23; width: 396px; }
  .pedal.freeze { --paint: #7fb6d6; --paint-light: #b5dcf0; --paint-dark: #4b84a6; --ink: #0d2a38; }
  .pedal.reverb { --paint: #6e55a8; --paint-light: #9d86d6; --paint-dark: #45317a; --ink: #f1ebff; }
  /* Four screws in the corners. */
  .pedal::before, .pedal::after, .screws::before, .screws::after {
    content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f2f2f2, #8a8a8a 60%, #4a4a4a);
    box-shadow: 0 1px 1px #0008;
  }
  .pedal::before { top: 9px; left: 9px; }
  .pedal::after { top: 9px; right: 9px; }
  .screws::before { bottom: 9px; left: 9px; }
  .screws::after { bottom: 9px; right: 9px; }
  .knobs { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 22px; }
  .pedal es-knob {
    --es-knob-size: 58px; --es-accent: #f3efe2; --es-surface: #f3efe2; --es-line: #00000040;
    --es-text: var(--ink); --es-muted: var(--ink); --es-font: 700 10px/1.2 system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: 0.12em; text-align: center;
  }
  .pedal es-knob::part(body) { stroke: #00000055; stroke-width: 2; filter: drop-shadow(0 2px 2px #0007); }
  .pedal es-knob::part(pointer) { stroke: #1a1a1a; stroke-width: 5; }
  .pedal es-knob::part(fill) { stroke: #ffffffb0; }
  .pedal es-knob::part(value) { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; }
  .name { text-align: center; color: var(--ink); }
  .name strong { display: block; font: 900 28px/1 system-ui, sans-serif; letter-spacing: 0.08em; }
  .name small { font: 700 10px/1.6 system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.8; }
  .pedal es-lamp { --es-lamp-size: 12px; --es-accent: #ff3b30; --es-surface: #4a1210; --es-line: #00000080; }
  .pedal es-lamp::part(label) { display: none; }
  /* The footswitch: the toggle drawn as a chrome button, its thumb hidden. */
  .pedal es-toggle { --es-toggle-length: 64px; --es-toggle-thickness: 64px; --es-accent: transparent; --es-line: transparent; }
  .pedal es-toggle::part(label) { display: none; }
  .pedal es-toggle::part(track) {
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffffff, #b9bcc0 35%, #6b6f74 70%, #3a3d41);
    box-shadow: 0 0 0 6px #2b2d30, 0 0 0 7px #00000088, 0 6px 10px #000a;
  }
  .pedal es-toggle::part(track on) { transform: translateY(2px); box-shadow: 0 0 0 6px #2b2d30, 0 0 0 7px #00000088, 0 2px 4px #000a; }
  .pedal es-toggle::part(thumb) { display: none; }
  .jack { position: absolute; top: 46%; width: 10px; height: 26px; background: linear-gradient(#5a5a5a, #2a2a2a); }
  .jack.in { right: -10px; border-radius: 0 3px 3px 0; }
  .jack.out { left: -10px; border-radius: 3px 0 0 3px; }
  /* The spectral delay's bands: a slider each, as a graphic equalizer's. */
  .bands { display: flex; gap: 4px; padding: 10px 10px 8px; border-radius: 8px; background: #00000026;
           box-shadow: inset 0 1px 3px #0006; }
  .band { display: grid; justify-items: center; gap: 4px; width: 40px; }
  .band .time { font: 700 9px/1 system-ui, sans-serif; color: var(--ink); opacity: 0.75; }
  .pedal es-slider {
    --es-slider-length: 108px; --es-slider-thickness: 6px; --es-accent: #f3efe2; --es-surface: #f3efe2;
    --es-line: #00000055; --es-text: #f3efe2; --es-muted: var(--ink); --es-font: 700 9px/1.2 system-ui, sans-serif;
    text-align: center; letter-spacing: 0.04em;
  }
  .pedal es-slider::part(thumb) { background: #f3efe2; box-shadow: 0 1px 3px #000a; }
  .pedal es-slider::part(value) { color: var(--ink); font-weight: 600; }
  .pedal .row { display: flex; gap: 22px; align-items: center; }
  /* Out: the volume and the level in a black box at the end of the chain. */
  .output { position: relative; width: 112px; padding: 22px 16px 24px; border-radius: 10px; box-sizing: border-box;
         display: grid; justify-items: center; align-content: start; gap: 18px;
         background: linear-gradient(160deg, #3a3a3d, #232325 50%, #161618);
         box-shadow: inset 0 1px 0 #ffffff22, 0 14px 26px #000000aa; }
  .output h2 { margin: 0; font: 800 12px/1 system-ui, sans-serif; letter-spacing: 0.3em; color: #d8d8d8; }
  .output es-knob { --es-knob-size: 58px; --es-accent: #e8e8e8; --es-surface: #1a1a1c; --es-line: #4a4a4e; --es-text: #e8e8e8;
                 --es-muted: #a0a0a6; --es-font: 700 10px/1.2 system-ui, sans-serif; text-transform: uppercase;
                 letter-spacing: 0.12em; text-align: center; }
  .output es-knob::part(value) { letter-spacing: 0; text-transform: none; font-weight: 600; }
  .output es-meter { --es-meter-length: 150px; --es-meter-thickness: 10px; --es-accent: #9be36b; --es-surface: #101012;
                  --es-line: #4a4a4e; --es-text: #f2f2f2; --es-muted: #a0a0a6; --es-font: 700 10px/1.2 system-ui, sans-serif;
                  text-transform: uppercase; letter-spacing: 0.12em; }
  .status { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #8a8a8e; font-size: 12px; }
</style>
</head>
<body>
<main class="board" aria-label="Pedalboard">
  <section class="pedal loop" aria-label="Loop">
    <span class="screws" aria-hidden="true"></span>
    <span class="jack in" aria-hidden="true"></span>
    <es-knob address="/speed" label="Speed" min="0.04167" max="0.3333" scale="exp" value="0.1667" unit="speed"></es-knob>
    <div class="name"><strong>LOOP</strong><small>6 s arpeggio</small></div>
  </section>
  <section class="pedal delay" aria-label="Spectral delay">
    <span class="screws" aria-hidden="true"></span>
    <span class="jack in" aria-hidden="true"></span><span class="jack out" aria-hidden="true"></span>
    <div class="bands" aria-label="Feedback of each band">
      <div class="band"><span class="time">4.75 s</span>
        <es-slider address="/band/250" label="250" min="0" max="0.95" value="0.52" unit="%" orientation="vertical"></es-slider></div>
      <div class="band"><span class="time">2.83 s</span>
        <es-slider address="/band/400" label="400" min="0" max="0.95" value="0.63" unit="%" orientation="vertical"></es-slider></div>
      <div class="band"><span class="time">3.08 s</span>
        <es-slider address="/band/630" label="630" min="0" max="0.95" value="0.3" unit="%" orientation="vertical"></es-slider></div>
      <div class="band"><span class="time">2.76 s</span>
        <es-slider address="/band/1000" label="1k" min="0" max="0.95" value="0.33" unit="%" orientation="vertical"></es-slider></div>
      <div class="band"><span class="time">2.11 s</span>
        <es-slider address="/band/1600" label="1.6k" min="0" max="0.95" value="0.4" unit="%" orientation="vertical"></es-slider></div>
      <div class="band"><span class="time">4.59 s</span>
        <es-slider address="/band/2500" label="2.5k" min="0" max="0.95" value="0.51" unit="%" orientation="vertical"></es-slider></div>
      <div class="band"><span class="time">1.87 s</span>
        <es-slider address="/band/4000" label="4k" min="0" max="0.95" value="0.49" unit="%" orientation="vertical"></es-slider></div>
      <div class="band"><span class="time">3.92 s</span>
        <es-slider address="/band/6300" label="6.3k" min="0" max="0.95" value="0.49" unit="%" orientation="vertical"></es-slider></div>
    </div>
    <div class="row">
      <es-knob address="/q" label="Q" min="0.5" max="10" scale="exp" value="2"></es-knob>
      <es-lamp address="/level" label="Level" max="0.3"></es-lamp>
      <es-knob address="/damping" label="Damping" min="0" max="1" value="0" unit="%"></es-knob>
    </div>
    <div class="name"><strong>SPECTRAL</strong><small>eight-band delay</small></div>
  </section>
  <section class="pedal freeze" aria-label="Freeze pedal">
    <span class="screws" aria-hidden="true"></span>
    <span class="jack in" aria-hidden="true"></span><span class="jack out" aria-hidden="true"></span>
    <es-knob address="/chance" label="Chance" min="0" max="1" value="0.5" unit="%"></es-knob>
    <es-lamp address="/frozen" label="Frozen"></es-lamp>
    <div class="name"><strong>FREEZE</strong><small>spectral hold</small></div>
    <es-toggle address="/freeze" label="Freeze" value="0"></es-toggle>
  </section>
  <section class="pedal reverb" aria-label="Reverb pedal">
    <span class="screws" aria-hidden="true"></span>
    <span class="jack in" aria-hidden="true"></span><span class="jack out" aria-hidden="true"></span>
    <div class="knobs" style="grid-template-columns: auto">
      <es-knob address="/reverb/mix" label="Mix" min="0" max="1" value="0.4" unit="%"></es-knob>
      <es-knob address="/reverb/tone" label="Tone" min="0" max="1" value="0.2" unit="%"></es-knob>
    </div>
    <es-lamp address="/level" label="Level" max="0.3"></es-lamp>
    <div class="name"><strong>REVERB</strong><small>size 0.9</small></div>
  </section>
  <section class="output" aria-label="Out">
    <span class="jack out" aria-hidden="true"></span>
    <h2>OUT</h2>
    <es-knob address="/volume" label="Volume" min="0" max="1" scale="db" value="0.6" unit="db"></es-knob>
    <es-meter address="/level" label="Level" max="0.5" orientation="vertical"></es-meter>
  </section>
</main>
<p class="status" id="status" role="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  // The head's speed as a multiple of the arpeggio's own: a rate of 1/6 Hz plays it as recorded.
  espressoUI.units.speed = (v) => `${(v * 6).toFixed(2)}×`;
  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
