<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>page-keys</title>
<style>
  body {
    font: 15px/1.4 system-ui, sans-serif; margin: 2rem; color: #222; background: #f4f1ea;
    --es-font: 15px/1.4 system-ui, sans-serif;
    --es-text: #222; --es-muted: #555; --es-surface: #fff; --es-line: #ccc; --es-accent: #3a7;
    --es-key-white: #fff; --es-key-black: #222; --es-keys-height: 10rem;
    --es-slider-length: 18rem; --es-meter-length: 18rem; --es-meter-thickness: 0.8rem;
  }
  h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  .row { display: flex; gap: 2rem; margin: 1rem 0; }
  es-keys { margin: 1rem 0; }
  .status { color: #777; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>page-keys</h1>
<div class="row">
  <es-slider address="/cutoff" label="Cutoff" min="0" max="1" step="0.001" value="0.6"></es-slider>
  <es-meter address="/level" label="Level" max="0.25"></es-meter>
</div>
<!-- Two octaves from C3 (MIDI 48): a press sends ["/note", note, 100], a
     release ["/note", note, 0]. -->
<es-keys label="Keys" low="48" high="71"></es-keys>
<p class="status" id="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
