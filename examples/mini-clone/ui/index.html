<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini-clone</title>
<style>
  :root {
    --wood: #6b3f1d; --wood-light: #9a6233; --panel: #141312; --ink: #f2efe6; --dim: #9b968c;
    --knob: #1c1b1a; --knob-edge: #3a3835; --blue: #3b6fb6; --white: #e8e4da; --orange: #d9822b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.2rem; overflow-x: auto; background: #2b2724; font: 10px/1.2 "Helvetica Neue", Helvetica, Arial, sans-serif;
         color: var(--ink); }
  .instrument { display: flex; min-width: 84rem; max-width: 92rem; margin: 0 auto; filter: drop-shadow(0 0.6rem 1rem rgba(0, 0, 0, 0.5)); }
  .cheek { width: 2.2rem; flex: none; border-radius: 0.5rem;
           background: repeating-linear-gradient(100deg, var(--wood) 0 0.35rem, var(--wood-light) 0.35rem 0.5rem, var(--wood) 0.5rem 0.9rem); }
  .body { flex: 1; display: flex; flex-direction: column; }

  /* The panel: five sections in a row, their names on a strip below. */
  .panel { background: var(--panel); border: 0.25rem solid #0a0a0a; border-radius: 0.3rem 0.3rem 0 0;
           display: grid; grid-template-columns: 1.1fr 2.6fr 1.6fr 2.6fr 1fr; }
  .section { padding: 0.8rem 0.5rem 0.3rem; border-left: 1px solid #f2efe633; display: flex; flex-direction: column; gap: 0.6rem; }
  .section:first-child { border-left: none; }
  .strip { display: contents; }
  .strip span { text-align: center; letter-spacing: 0.2em; font-weight: 700; padding: 0.35rem 0; border-top: 1px solid var(--ink);
                border-left: 1px solid #f2efe633; }
  .strip span:first-child { border-left: none; }
  .row { display: flex; align-items: flex-start; justify-content: space-around; gap: 0.4rem; }
  .group-title { text-align: center; letter-spacing: 0.15em; font-weight: 700; color: var(--ink); margin-top: 0.2rem; }

  /* Knobs: a skirt with its scale around it, turned by dragging up and down. */
  .knob { display: flex; flex-direction: column; align-items: center; width: 5.4rem; }
  .knob .label { height: 2.2em; text-align: center; text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: flex-end; }
  .dial { position: relative; width: 4.6rem; height: 4.6rem; }
  .dial .tick { position: absolute; left: 50%; top: 50%; font-size: 8px; color: var(--dim); transform: translate(-50%, -50%); }
  .cap { position: absolute; inset: 0.85rem; border-radius: 50%; cursor: ns-resize; touch-action: none; outline: none;
         background: radial-gradient(circle at 40% 35%, #3a3836, var(--knob) 60%);
         box-shadow: 0 0 0 0.22rem var(--knob-edge), 0 0.2rem 0.4rem rgba(0, 0, 0, 0.8); }
  .cap:focus-visible { box-shadow: 0 0 0 0.22rem var(--orange), 0 0.2rem 0.4rem rgba(0, 0, 0, 0.8); }
  .cap::after { content: ""; position: absolute; left: 50%; top: 0.15rem; width: 0.16rem; height: 38%; margin-left: -0.08rem;
                background: var(--ink); border-radius: 0.1rem; }
  .knob .value { color: var(--dim); height: 1.2em; margin-top: 0.1rem; font-variant-numeric: tabular-nums; }

  /* Rocker switches. */
  .rocker { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; width: 4.2rem; }
  .rocker .label { text-align: center; text-transform: uppercase; letter-spacing: 0.06em; min-height: 2.2em; display: flex; align-items: flex-end; }
  .rocker button { width: 1.6rem; height: 2.4rem; border: 0.15rem solid #0a0a0a; border-radius: 0.2rem; cursor: pointer; padding: 0;
                   background: linear-gradient(var(--c) 0 50%, color-mix(in srgb, var(--c) 60%, black) 50%); }
  .rocker button[aria-pressed="true"] { background: linear-gradient(color-mix(in srgb, var(--c) 60%, black) 0 50%, var(--c) 50%); }
  .rocker .state { color: var(--dim); }

  /* The left-hand controllers and the keyboard. */
  .lower { display: flex; background: #0e0d0c; border: 0.25rem solid #0a0a0a; border-top: none; padding: 0.6rem; gap: 0.8rem;
           border-radius: 0 0 0.3rem 0.3rem; }
  .left { width: 11rem; flex: none; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .wheels { display: flex; gap: 1rem; }
  .wheel { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .wheel .slot { width: 1.7rem; height: 7rem; border-radius: 0.3rem; background: #050505; padding: 0.2rem; touch-action: none; cursor: ns-resize; }
  .wheel .disc { width: 100%; height: 100%; border-radius: 0.25rem; background-size: 100% 0.5rem;
                 background-image: repeating-linear-gradient(#2a2826 0 0.25rem, #4a4743 0.25rem 0.5rem); }
  .badge { font: 700 2.6rem/1 Georgia, "Times New Roman", serif; color: var(--ink); margin-top: 0.2rem; }
  .keys { position: relative; flex: 1; display: flex; height: 12rem; user-select: none; touch-action: none; }
  .key { flex: 1; background: linear-gradient(#f7f3e9, #e9e3d6); border: 1px solid #111; margin-right: -1px;
         border-radius: 0 0 0.25rem 0.25rem; }
  .key.black { position: absolute; height: 60%; background: linear-gradient(#2a2a2a, #050505); z-index: 1; border-radius: 0 0 0.15rem 0.15rem; }
  .key.down { background: #f0c98a; }
  .key.black.down { background: #6b4a1e; }

  .nameplate { display: flex; align-items: center; gap: 0.6rem; padding: 0.3rem 0.8rem; background: #0e0d0c; border: 0.25rem solid #0a0a0a;
               border-top: none; border-bottom: none; }
  .nameplate .lambda { font: 700 1.7rem/1 Georgia, "Times New Roman", serif; }
  .nameplate .name { font: 300 1.4rem/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.12em; }
  .nameplate .status { margin-left: auto; color: var(--dim); }
  .meter { width: 3.6rem; height: 0.5rem; background: #050505; border-radius: 0.25rem; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: var(--orange); transition: width 60ms linear; }
</style>
</head>
<body>
<div class="instrument">
  <div class="cheek"></div>
  <div class="body">
    <div class="panel" id="panel">
      <div class="section" id="controllers"></div>
      <div class="section" id="oscillators"></div>
      <div class="section" id="mixer"></div>
      <div class="section" id="modifiers"></div>
      <div class="section" id="output"></div>
      <div class="strip"><span>CONTROLLERS</span><span>OSCILLATOR BANK</span><span>MIXER</span><span>MODIFIERS</span><span>OUTPUT</span></div>
    </div>
    <div class="nameplate"><span class="lambda" aria-hidden="true">λ</span><span class="name">mini-clone</span>
      <span class="status" id="status">Connecting…</span></div>
    <div class="lower">
      <div class="left" id="left"></div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
  <div class="cheek"></div>
</div>
<script src="/espresso.js"></script>
<script>
  "use strict";

  // Every control sends [address, value] as it moves, and its value once
  // the socket opens. send(address, value) is the one way out.
  const all = [];
  const send = (address, value) => espresso.send(address, value);
  const exp = (lo, hi) => (s) => lo * Math.pow(hi / lo, s);
  const lin = (lo, hi) => (s) => lo + s * (hi - lo);
  const seconds = (v) => (v < 1 ? Math.round(v * 1000) + " ms" : v.toFixed(1) + " s");

  function el(tag, className, parent) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (parent) parent.appendChild(e);
    return e;
  }

  // A knob: position s from 0 to 1 over 300 degrees; value(s) is sent.
  // ticks label the scale; steps makes it a selector of that many stops.
  function knob(parent, spec) {
    const box = el("div", "knob", parent);
    el("div", "label", box).textContent = spec.label;
    const dial = el("div", "dial", box);
    const ticks = spec.ticks || ["0", "2", "4", "6", "8", "10"];
    ticks.forEach((t, i) => {
      const tick = el("span", "tick", dial);
      const a = (-150 + 300 * i / (ticks.length - 1)) * Math.PI / 180;
      tick.style.left = (50 + 46 * Math.sin(a)) + "%";
      tick.style.top = (50 - 46 * Math.cos(a)) + "%";
      if (typeof t === "string") tick.textContent = t; else tick.appendChild(t());
    });
    const cap = el("div", "cap", dial);
    cap.tabIndex = 0;
    cap.setAttribute("role", "slider");
    cap.setAttribute("aria-label", spec.label);
    const shown = el("div", "value", box);
    const stops = spec.steps || 0;
    let s = spec.start;
    const quantized = () => (stops ? Math.round(s * (stops - 1)) / (stops - 1) : s);
    const value = () => (stops ? Math.round(s * (stops - 1)) : spec.value(s));
    function render() {
      const q = quantized();
      cap.style.transform = "rotate(" + (-150 + 300 * q) + "deg)";
      const text = spec.show ? spec.show(value()) : value().toFixed(2);
      shown.textContent = text;
      cap.setAttribute("aria-valuetext", text);
    }
    function set(next) {
      const before = value();
      s = Math.min(1, Math.max(0, next));
      render();
      if (value() !== before || !stops) send(spec.address, value());
    }
    let drag = null;
    cap.addEventListener("pointerdown", (e) => { cap.setPointerCapture(e.pointerId); drag = { y: e.clientY, s }; });
    cap.addEventListener("pointermove", (e) => { if (drag) set(drag.s + (drag.y - e.clientY) / 150); });
    cap.addEventListener("pointerup", () => { drag = null; });
    cap.addEventListener("dblclick", () => set(spec.start));
    cap.addEventListener("keydown", (e) => {
      const step = stops ? 1 / (stops - 1) : 0.01;
      if (e.key === "ArrowUp" || e.key === "ArrowRight") set(s + step);
      else if (e.key === "ArrowDown" || e.key === "ArrowLeft") set(s - step);
      else return;
      e.preventDefault();
    });
    render();
    all.push(() => send(spec.address, value()));
  }

  // A rocker switch, on or off; color is its cap's.
  function rocker(parent, spec) {
    const box = el("div", "rocker", parent);
    el("div", "label", box).textContent = spec.label;
    const button = el("button", "", box);
    button.style.setProperty("--c", spec.color || "var(--white)");
    button.setAttribute("aria-label", spec.label);
    const state = el("div", "state", box);
    let on = spec.on;
    const render = () => {
      button.setAttribute("aria-pressed", String(on));
      state.textContent = on ? (spec.onText || "on") : (spec.offText || "off");
    };
    button.addEventListener("click", () => { on = !on; render(); send(spec.address, on ? 1 : 0); });
    render();
    all.push(() => send(spec.address, on ? 1 : 0));
  }

  // Waveform icons for the selectors: triangle, triangle and sawtooth,
  // reverse sawtooth, square, wide pulse, narrow pulse.
  const shapes = ["M0 8 L4 0 L8 8", "M0 8 L3 0 L5 4 L8 0", "M0 0 L0 8 L8 0 L8 8", "M0 8 V0 H4 V8 H8 V0",
                  "M0 8 V0 H5.5 V8 H8 V0", "M0 8 V0 H1.5 V8 H8 V0"];
  const icon = (d) => () => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "-1 -1 10 10");
    svg.setAttribute("width", "11");
    svg.setAttribute("height", "11");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.2");
    svg.appendChild(path);
    return svg;
  };
  const range = (address, label) => ({ address, label, steps: 6, start: 0.6,
    ticks: ["LO", "32", "16", "8", "4", "2"], show: (v) => ["LO", "32'", "16'", "8'", "4'", "2'"][v] });
  const wave = (address, label, start) => ({ address, label, steps: 6, start: start / 5,
    ticks: shapes.map(icon), show: () => "" });
  const level = (address, label, start) => ({ address, label, start, value: lin(0, 1), show: (v) => (v * 10).toFixed(1) });
  const time = (address, label, lo, hi, start) => ({ address, label, start, value: exp(lo, hi), show: seconds });
  const sustain = (address, start) => ({ address, label: "Sustain level", start, value: lin(0, 1), show: (v) => (v * 10).toFixed(1) });
  const bipolar = ["-5", "-3", "-1", "1", "3", "5"];

  // CONTROLLERS
  const controllers = document.getElementById("controllers");
  knob(el("div", "row", controllers), { address: "/tune", label: "Tune", start: 0.5, value: lin(-2, 2),
    ticks: ["-2", "-1", "0", "1", "2"], show: (v) => (v >= 0 ? "+" : "") + v.toFixed(2) + " st" });
  const lowerControllers = el("div", "row", controllers);
  knob(lowerControllers, level("/glide", "Glide", 0));
  knob(lowerControllers, { address: "/modmix", label: "Modulation mix", start: 0, value: lin(0, 1),
    ticks: ["osc 3", "", "", "", "", "noise"], show: (v) => (v * 10).toFixed(1) });

  // OSCILLATOR BANK
  const oscillators = document.getElementById("oscillators");
  const osc1 = el("div", "row", oscillators);
  rocker(osc1, { address: "/osc/mod", label: "Oscillator modulation", on: false, color: "var(--white)" });
  knob(osc1, range("/osc1/range", "Range"));
  el("div", "knob", osc1);
  knob(osc1, wave("/osc1/wave", "Waveform", 2));
  el("div", "group-title", oscillators).textContent = "OSCILLATOR — 1";
  const osc2 = el("div", "row", oscillators);
  el("div", "rocker", osc2);
  knob(osc2, range("/osc2/range", "Range"));
  knob(osc2, { address: "/osc2/freq", label: "Frequency", start: 0.507, value: lin(-7, 7),
    ticks: ["-7", "-3", "0", "3", "7"], show: (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + " st" });
  knob(osc2, wave("/osc2/wave", "Waveform", 2));
  el("div", "group-title", oscillators).textContent = "OSCILLATOR — 2";
  const osc3 = el("div", "row", oscillators);
  rocker(osc3, { address: "/osc3/control", label: "Osc. 3 control", on: true, color: "var(--orange)" });
  knob(osc3, range("/osc3/range", "Range"));
  knob(osc3, { address: "/osc3/freq", label: "Frequency", start: 0.493, value: lin(-7, 7),
    ticks: ["-7", "-3", "0", "3", "7"], show: (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + " st" });
  knob(osc3, wave("/osc3/wave", "Waveform", 3));
  el("div", "group-title", oscillators).textContent = "OSCILLATOR — 3";

  // MIXER: volumes and their switches, zig-zagging down the section.
  const mixer = document.getElementById("mixer");
  const mix = (address, label, start, on, flip, extra) => {
    const row = el("div", "row", mixer);
    const parts = [() => knob(row, level(address, label, start)),
                   () => rocker(row, { address: address + "/on", label: "", on, color: "var(--blue)" })];
    (flip ? parts.reverse() : parts).forEach((p) => p());
    if (extra) extra(row);
  };
  mix("/mix/osc1", "Osc. 1 volume", 0.8, true, false);
  mix("/mix/ext", "Ext. input volume", 0, false, true);
  mix("/mix/osc2", "Osc. 2 volume", 0.6, true, false);
  mix("/mix/noise", "Noise volume", 0.3, false, true,
      (row) => rocker(row, { address: "/noise/pink", label: "", on: false, color: "var(--white)", onText: "pink", offText: "white" }));
  mix("/mix/osc3", "Osc. 3 volume", 0.4, true, false);

  // MODIFIERS
  const modifiers = document.getElementById("modifiers");
  const filterTop = el("div", "row", modifiers);
  rocker(filterTop, { address: "/filter/mod", label: "Filter modulation", on: false, color: "var(--white)" });
  knob(filterTop, { address: "/filter/cutoff", label: "Cutoff frequency", start: 0.55, value: lin(-5, 5),
    ticks: bipolar, show: (v) => Math.round(440 * Math.pow(2, v)) + " Hz" });
  knob(filterTop, { address: "/filter/emphasis", label: "Emphasis", start: 0.3, value: lin(0, 1), show: (v) => (v * 10).toFixed(1) });
  knob(filterTop, { address: "/filter/amount", label: "Amount of contour", start: 0.5, value: lin(0, 5),
    show: (v) => (v * 2).toFixed(1) });
  const filterBottom = el("div", "row", modifiers);
  const keyboardControl = el("div", "row", filterBottom);
  rocker(keyboardControl, { address: "/filter/kb1", label: "Keyboard control 1", on: true, color: "var(--white)" });
  rocker(keyboardControl, { address: "/filter/kb2", label: "Keyboard control 2", on: false, color: "var(--white)" });
  knob(filterBottom, time("/filter/attack", "Attack time", 0.001, 10, 0.2));
  knob(filterBottom, time("/filter/decay", "Decay time", 0.004, 35, 0.45));
  knob(filterBottom, sustain("/filter/sustain", 0.3));
  el("div", "group-title", modifiers).textContent = "FILTER";
  const loudness = el("div", "row", modifiers);
  el("div", "rocker", loudness);
  knob(loudness, time("/amp/attack", "Attack time", 0.001, 10, 0.2));
  knob(loudness, time("/amp/decay", "Decay time", 0.004, 35, 0.42));
  knob(loudness, sustain("/amp/sustain", 0.8));
  el("div", "group-title", modifiers).textContent = "LOUDNESS CONTOUR";

  // OUTPUT
  const output = document.getElementById("output");
  const main = el("div", "row", output);
  knob(main, level("/volume", "Volume", 0.7));
  const switches = el("div", "row", output);
  rocker(switches, { address: "/power", label: "Main output", on: true, color: "var(--blue)" });
  rocker(switches, { address: "/a440", label: "A-440", on: false, color: "var(--white)" });
  const meterRow = el("div", "row", output);
  const meter = el("div", "meter", meterRow);
  const bar = el("div", "", meter);
  espresso.on("/level", (v) => { bar.style.width = Math.min(100, v * 300) + "%"; });

  // The left-hand controllers: glide and decay switches, and the wheels.
  const left = document.getElementById("left");
  const leftSwitches = el("div", "row", left);
  rocker(leftSwitches, { address: "/glide/on", label: "Glide", on: true, color: "var(--white)" });
  rocker(leftSwitches, { address: "/decay/on", label: "Decay", on: true, color: "var(--white)" });
  const wheels = el("div", "wheels", left);
  function wheel(label, address, start, springs) {
    const box = el("div", "wheel", wheels);
    const slot = el("div", "slot", box);
    const disc = el("div", "disc", slot);
    slot.tabIndex = 0;
    slot.setAttribute("role", "slider");
    slot.setAttribute("aria-label", label);
    el("div", "label", box).textContent = label;
    let v = start;
    const render = () => { disc.style.backgroundPositionY = (v * 2.4) + "rem"; slot.setAttribute("aria-valuenow", v.toFixed(2)); };
    const set = (next) => { v = Math.min(1, Math.max(springs ? -1 : 0, next)); render(); send(address, v); };
    let drag = null;
    slot.addEventListener("pointerdown", (e) => { slot.setPointerCapture(e.pointerId); drag = { y: e.clientY, v }; });
    slot.addEventListener("pointermove", (e) => { if (drag) set(drag.v + (drag.y - e.clientY) / 60); });
    slot.addEventListener("pointerup", () => { drag = null; if (springs) set(0); });
    slot.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") set(v + 0.05); else if (e.key === "ArrowDown") set(v - 0.05); else return;
      e.preventDefault();
    });
    slot.addEventListener("keyup", () => { if (springs) set(0); });
    render();
    all.push(() => send(address, v));
  }
  wheel("Pitch", "/bend", 0, true);
  wheel("Mod.", "/modwheel", 0, false);
  const badge = el("div", "badge", left);
  badge.textContent = "λ";
  badge.setAttribute("aria-hidden", "true");

  // 44 keys, F2 to C6; a key sounds while pressed.
  const keys = document.getElementById("keys");
  const whites = [0, 2, 4, 5, 7, 9, 11];
  const first = 41;
  const last = 84;
  let whiteCount = 0;
  for (let n = first; n <= last; ++n) if (whites.includes(n % 12)) ++whiteCount;
  let whiteIndex = 0;
  for (let n = first; n <= last; ++n) {
    const key = el("div", "key", keys);
    key.dataset.note = n;
    if (whites.includes(n % 12)) {
      ++whiteIndex;
    } else {
      key.classList.add("black");
      key.style.left = (whiteIndex / whiteCount * 100 - 100 / whiteCount * 0.32) + "%";
      key.style.width = (100 / whiteCount * 0.64) + "%";
    }
  }
  const held = new Map();
  function press(pointer, key) {
    if (!key || !key.dataset || !key.dataset.note) return;
    release(pointer);
    held.set(pointer, key);
    key.classList.add("down");
    send("/note", Number(key.dataset.note), 100);
  }
  function release(pointer) {
    const key = held.get(pointer);
    if (!key) return;
    held.delete(pointer);
    key.classList.remove("down");
    send("/note", Number(key.dataset.note), 0);
  }
  keys.addEventListener("pointerdown", (e) => { keys.setPointerCapture(e.pointerId); press(e.pointerId, e.target); });
  keys.addEventListener("pointermove", (e) => {
    if (!held.has(e.pointerId)) return;
    const over = document.elementFromPoint(e.clientX, e.clientY);
    if (over !== held.get(e.pointerId)) press(e.pointerId, over);
  });
  for (const type of ["pointerup", "pointercancel"]) keys.addEventListener(type, (e) => release(e.pointerId));

  // Every control's value once the socket opens, so the piece starts where
  // the panel is.
  (function sync() {
    if (!espresso.send("/power", 1)) {
      setTimeout(sync, 200);
      return;
    }
    for (const f of all) f();
    document.getElementById("status").textContent = "Connected";
  })();
</script>
</body>
</html>
