<!doctype html>
<!-- report's page: the synthesizer's panel. Oscillators: the three sines'
     pitches. Swell: the LFO's rate, centre, and depth, whose screen draws
     the swell over the last 20 s. Report: the request the piece posts, the
     loudness it posted last, a light at each report, the requests dropped,
     and a meter of the loudness. Each control starts at the value the
     piece gives its osc-in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>report</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; background: radial-gradient(circle at 50% 30%, #262422, #121110 70%);
    font: 13px/1.3 system-ui, sans-serif; color: #ece7dc;
  }

  /* The synth kit: a panel between walnut cheeks. */
  .synth {
    --hue: #8fd16a;
    display: grid; grid-template-columns: 26px auto 26px; border-radius: 8px; box-shadow: 0 28px 70px #000d;
  }
  .cheek { background: linear-gradient(90deg, #4a2c18, #7b4d2c 35%, #5c371e 70%, #3b2313); }
  .cheek:first-child { border-radius: 8px 0 0 8px; }
  .cheek:last-child { border-radius: 0 8px 8px 0; }
  .panel {
    padding: 18px 26px 24px; background: linear-gradient(#34322f, #24231f);
    box-shadow: inset 0 1px 0 #ffffff22, inset 0 -2px 0 #00000055;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
         padding-bottom: 12px; margin-bottom: 18px; border-bottom: 1px solid #ffffff1c; }
  .model { font: 800 24px/1 system-ui, sans-serif; letter-spacing: 0.24em; }
  .model span { color: var(--hue); }
  .maker { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #a39c8f; text-transform: uppercase; }
  .sections { display: flex; align-items: stretch; }
  .sections section { padding: 0 22px; border-left: 1px solid #ffffff14; display: grid; align-content: start; gap: 14px; }
  .sections section:first-child { padding-left: 0; border-left: 0; }
  .sections section:last-child { padding-right: 0; }
  h2 { margin: 0; font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.28em; color: var(--hue); text-transform: uppercase; }
  .synth es-knob {
    --es-knob-size: 58px; --es-accent: var(--hue); --es-surface: #1b1a18; --es-line: #4d4a45;
    --es-text: #ece7dc; --es-muted: #a39c8f; --es-font: 600 10px/1.3 system-ui, sans-serif;
    text-align: center; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .synth es-knob.big { --es-knob-size: 84px; }
  .synth es-knob::part(body) { fill: url(#knob); stroke: #000; stroke-width: 2; }
  .synth es-knob::part(pointer) { stroke: #f4efe4; }
  .synth es-knob::part(value) { color: #ece7dc; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .synth es-meter {
    --es-accent: var(--hue); --es-surface: #121110; --es-line: #4d4a45; --es-text: #f4efe4; --es-muted: #a39c8f;
    --es-meter-length: 120px; --es-meter-thickness: 8px; --es-font: 600 10px/1.3 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .synth es-lamp { --es-lamp-size: 10px; --es-accent: var(--hue); --es-surface: #16200f; --es-line: #000; }
  .synth es-lamp::part(label) { display: none; }

  /* The screens: the swell's last 20 s, and the last report as it was posted. */
  .screen { position: relative; box-sizing: border-box; border-radius: 4px; background: #0d140a;
            box-shadow: inset 0 0 0 1px #000, inset 0 0 18px #8fd16a22; color: #d4f0c0;
            font-variant-numeric: tabular-nums; }
  .trace { width: 236px; height: 60px; }
  .trace canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .post { width: 252px; height: 92px; padding: 10px 14px; display: grid; align-content: space-between;
          font: 500 11px/1.35 ui-monospace, "SF Mono", Menlo, monospace; }
  .post .line { display: flex; justify-content: space-between; align-items: center; color: #8fb57a; }
  .post .body { font-size: 15px; color: #d4f0c0; }
  .post .body b { font-weight: 600; }
  .status { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #8a857c; font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
  <defs><radialGradient id="knob" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#55524c"/><stop offset="0.6" stop-color="#2a2825"/><stop offset="1" stop-color="#151412"/>
  </radialGradient></defs>
</svg>
<main class="synth" aria-label="report">
  <div class="cheek" aria-hidden="true"></div>
  <div class="panel">
    <header class="top">
      <div class="model">SELF<span>REPORT</span></div>
      <div class="maker">Three-sine swell · loudness over HTTP</div>
    </header>
    <div class="sections">
      <section aria-label="Oscillators">
        <h2>Oscillators</h2>
        <div class="row">
          <es-knob address="/sine/1" label="Sine 1" min="55" max="880" scale="exp" value="220" unit="hz"></es-knob>
          <es-knob address="/sine/2" label="Sine 2" min="55" max="880" scale="exp" value="277.5" unit="hz"></es-knob>
          <es-knob address="/sine/3" label="Sine 3" min="55" max="880" scale="exp" value="330.4" unit="hz"></es-knob>
        </div>
      </section>
      <section aria-label="Swell">
        <h2>Swell</h2>
        <div class="screen trace" aria-hidden="true"><canvas id="trace" width="472" height="120"></canvas></div>
        <div class="row">
          <es-knob address="/swell/rate" label="Rate" min="0.01" max="2" scale="exp" value="0.1" unit="hz"></es-knob>
          <es-knob address="/swell/centre" label="Centre" min="0" max="1" value="0.5" unit="%"></es-knob>
          <es-knob address="/swell/depth" label="Depth" min="0" max="0.5" value="0.5" unit="%"></es-knob>
        </div>
      </section>
      <section aria-label="Report">
        <h2>Report</h2>
        <div class="screen post" role="group" aria-label="Last report">
          <div class="line"><span>POST localhost:8080/loudness</span><es-lamp id="sent" label="Sent"></es-lamp></div>
          <div class="body" id="body">{"loudness": –}</div>
          <div class="line"><span>every 4 beats</span><span>dropped <b id="dropped">0</b></span></div>
        </div>
        <es-meter address="/loudness" label="Loudness" max="0.25"></es-meter>
      </section>
    </div>
  </div>
  <div class="cheek" aria-hidden="true"></div>
</main>
<p class="status" id="status" role="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  // The swell over the last 20 s, sampled ten times a second, 0 at the
  // bottom and 1 at the top.
  const canvas = document.getElementById("trace");
  const pen = canvas.getContext("2d");
  const history = [];
  let swell = null;
  espresso.on("/swell", (s) => { swell = s; });
  const draw = () => {
    pen.clearRect(0, 0, canvas.width, canvas.height);
    pen.strokeStyle = "#ffffff14";
    pen.lineWidth = 1;
    for (const y of [0.25, 0.5, 0.75]) {
      pen.beginPath(); pen.moveTo(0, y * canvas.height); pen.lineTo(canvas.width, y * canvas.height); pen.stroke();
    }
    pen.strokeStyle = "#8fd16a";
    pen.lineWidth = 2.5;
    pen.beginPath();
    history.forEach((s, i) => {
      const x = canvas.width - (history.length - 1 - i) * (canvas.width / 199);
      const y = 10 + (1 - Math.min(Math.max(s, 0), 1)) * (canvas.height - 20);
      if (i === 0) pen.moveTo(x, y); else pen.lineTo(x, y);
    });
    pen.stroke();
  };
  setInterval(() => {
    if (swell === null) return;
    history.push(swell);
    if (history.length > 200) history.shift();
    draw();
  }, 100);
  draw();
  // At each report, the light flashes and the body shows the loudness
  // posted, as the piece last sent it.
  let loudness = null;
  espresso.on("/loudness", (l) => { loudness = l; });
  // The piece's count of reports, from 1 to 8, changes at each report.
  const lamp = document.getElementById("sent");
  let dark = null;
  espresso.on("/reports", () => {
    lamp.value = 1;
    clearTimeout(dark);
    dark = setTimeout(() => { lamp.value = 0; }, 250);
    if (loudness !== null) document.getElementById("body").textContent = `{"loudness": ${loudness.toFixed(3)}}`;
  });
  espresso.on("/dropped", (d) => { document.getElementById("dropped").textContent = String(Math.round(d)); });
  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
