<!doctype html>
<!-- sampler-keys' page: the sampler's panel. Sample: where in the recording
     of middle C each note starts, marked on the screen of the recording.
     Envelope: attack and release. Output: the volume and the level. The
     keyboard plays the voices. Each control starts at the value the piece
     gives its osc-in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sampler-keys</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #262422, #121110 70%);
    font: 13px/1.3 system-ui, sans-serif; color: #ece7dc;
  }
  .rig { display: grid; justify-items: center; gap: 22px; }

  /* The synth kit: a panel between walnut cheeks. */
  .synth {
    --hue: #6cb4ff;
    display: grid; grid-template-columns: 26px auto 26px; border-radius: 8px; box-shadow: 0 28px 70px #000d;
  }
  .cheek { background: linear-gradient(90deg, #4a2c18, #7b4d2c 35%, #5c371e 70%, #3b2313); }
  .cheek:first-child { border-radius: 8px 0 0 8px; }
  .cheek:last-child { border-radius: 0 8px 8px 0; }
  .panel {
    padding: 16px 26px 20px; background: linear-gradient(#34322f, #24231f);
    box-shadow: inset 0 1px 0 #ffffff22, inset 0 -2px 0 #00000055;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
         padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid #ffffff1c; }
  .model { font: 800 24px/1 system-ui, sans-serif; letter-spacing: 0.24em; }
  .model span { color: var(--hue); }
  .maker { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #a39c8f; text-transform: uppercase; }
  .sections { display: flex; align-items: stretch; }
  .sections section { padding: 0 22px; border-left: 1px solid #ffffff14; display: grid; align-content: start; gap: 14px; }
  .sections section:first-child { padding-left: 0; border-left: 0; }
  .sections section:last-child { padding-right: 0; }
  h2 { margin: 0; font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.28em; color: var(--hue); text-transform: uppercase; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .synth es-knob {
    --es-knob-size: 58px; --es-accent: var(--hue); --es-surface: #1b1a18; --es-line: #4d4a45;
    --es-text: #ece7dc; --es-muted: #a39c8f; --es-font: 600 10px/1.3 system-ui, sans-serif;
    text-align: center; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .synth es-knob.big { --es-knob-size: 84px; }
  .synth es-knob::part(body) { fill: url(#knob); stroke: #000; stroke-width: 2; }
  .synth es-knob::part(pointer) { stroke: #f4efe4; }
  .synth es-knob::part(value) { color: #ece7dc; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .synth es-meter {
    --es-accent: var(--hue); --es-surface: #121110; --es-line: #4d4a45; --es-text: #f4efe4; --es-muted: #a39c8f;
    --es-meter-length: 120px; --es-meter-thickness: 8px; --es-font: 600 10px/1.3 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  /* The screen: the recording's two seconds, and a marker where notes start. */
  .screen { position: relative; width: 300px; height: 84px; border-radius: 4px; background: #08111b;
            box-shadow: inset 0 0 0 1px #000, inset 0 0 18px #6cb4ff22; overflow: hidden; }
  .screen svg { position: absolute; inset: 6px 8px; width: calc(100% - 16px); height: calc(100% - 12px); }
  .screen path { fill: #6cb4ff66; stroke: #6cb4ffaa; stroke-width: 0.6; vector-effect: non-scaling-stroke; }
  .screen .played { position: absolute; top: 0; bottom: 0; left: 8px; right: 8px; background: #00000066; width: 0; }
  .marker { position: absolute; top: 0; bottom: 0; width: 2px; left: 8px; background: #f4efe4;
            box-shadow: 0 0 8px var(--hue); }
  .screen .readout { position: absolute; right: 8px; top: 6px; font: 600 9px/1 system-ui, sans-serif;
                     letter-spacing: 0.08em; color: #6cb4ffcc; }
  /* The keyboard, set into the panel below the sections. */
  .keybed { margin-top: 18px; padding: 8px 8px 0; border-radius: 4px; background: #121110;
            box-shadow: inset 0 2px 6px #000c; }
  .synth es-keys { --es-keys-height: 120px; --es-accent: var(--hue); --es-line: #00000080;
                   --es-key-white: #efe9dc; --es-key-black: #171614; }
  .status { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #8a857c; font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
  <defs><radialGradient id="knob" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#55524c"/><stop offset="0.6" stop-color="#2a2825"/><stop offset="1" stop-color="#151412"/>
  </radialGradient></defs>
</svg>
<div class="rig">
  <main class="synth" aria-label="sampler-keys">
    <div class="cheek" aria-hidden="true"></div>
    <div class="panel">
      <header class="top">
        <div class="model">SAMPLER<span>KEYS</span></div>
        <div class="maker">One recording of middle C · eight voices · espresso</div>
      </header>
      <div class="sections">
        <section aria-label="Sample">
          <h2>Sample</h2>
          <div class="row">
            <div class="screen" aria-hidden="true">
              <!-- The recording's peaks, 160 columns over its 2 s. -->
              <svg viewBox="0 0 159 40" preserveAspectRatio="none"><path d="M0,1.0 L1,2.4 L2,3.0 L3,3.4 L4,3.2 L5,3.8 L6,4.2 L7,5.4 L8,4.2 L9,5.0 L10,5.8 L11,6.6 L12,6.4 L13,5.5 L14,6.1 L15,8.2 L16,8.4 L17,8.3 L18,8.1 L19,7.8 L20,8.0 L21,9.1 L22,8.2 L23,8.3 L24,9.0 L25,9.5 L26,10.7 L27,11.5 L28,11.5 L29,11.0 L30,11.5 L31,12.0 L32,11.8 L33,11.6 L34,11.6 L35,11.1 L36,11.5 L37,10.8 L38,11.0 L39,11.2 L40,12.0 L41,12.7 L42,12.8 L43,12.9 L44,13.0 L45,13.0 L46,13.4 L47,13.3 L48,13.4 L49,13.6 L50,14.0 L51,14.1 L52,14.0 L53,14.2 L54,14.2 L55,14.4 L56,14.8 L57,15.2 L58,15.4 L59,15.4 L60,15.6 L61,15.6 L62,15.7 L63,15.7 L64,15.6 L65,15.5 L66,15.5 L67,15.7 L68,15.9 L69,16.0 L70,16.1 L71,16.0 L72,16.0 L73,16.0 L74,15.9 L75,15.9 L76,16.0 L77,16.2 L78,16.4 L79,16.5 L80,16.6 L81,16.6 L82,16.7 L83,16.7 L84,16.7 L85,16.7 L86,16.6 L87,16.5 L88,16.5 L89,16.5 L90,16.5 L91,16.6 L92,16.7 L93,16.8 L94,16.8 L95,16.8 L96,16.9 L97,16.9 L98,16.9 L99,17.0 L100,17.0 L101,17.1 L102,17.2 L103,17.2 L104,17.2 L105,17.2 L106,17.3 L107,17.4 L108,17.5 L109,17.6 L110,17.7 L111,17.8 L112,17.9 L113,17.9 L114,17.9 L115,18.0 L116,18.0 L117,18.1 L118,18.1 L119,18.1 L120,18.1 L121,18.2 L122,18.2 L123,18.2 L124,18.3 L125,18.4 L126,18.4 L127,18.4 L128,18.4 L129,18.5 L130,18.5 L131,18.5 L132,18.5 L133,18.5 L134,18.5 L135,18.5 L136,18.5 L137,18.6 L138,18.6 L139,18.6 L140,18.6 L141,18.6 L142,18.7 L143,18.7 L144,18.7 L145,18.7 L146,18.7 L147,18.7 L148,18.7 L149,18.7 L150,18.7 L151,18.7 L152,18.7 L153,18.7 L154,18.8 L155,18.8 L156,18.8 L157,18.8 L158,18.8 L159,18.9 L159,21.1 L158,21.2 L157,21.2 L156,21.2 L155,21.2 L154,21.2 L153,21.3 L152,21.3 L151,21.3 L150,21.3 L149,21.3 L148,21.3 L147,21.3 L146,21.3 L145,21.3 L144,21.3 L143,21.3 L142,21.3 L141,21.4 L140,21.4 L139,21.4 L138,21.4 L137,21.4 L136,21.5 L135,21.5 L134,21.5 L133,21.5 L132,21.5 L131,21.5 L130,21.5 L129,21.5 L128,21.6 L127,21.6 L126,21.6 L125,21.6 L124,21.7 L123,21.8 L122,21.8 L121,21.8 L120,21.9 L119,21.9 L118,21.9 L117,21.9 L116,22.0 L115,22.0 L114,22.1 L113,22.1 L112,22.1 L111,22.2 L110,22.3 L109,22.4 L108,22.5 L107,22.6 L106,22.7 L105,22.8 L104,22.8 L103,22.8 L102,22.8 L101,22.9 L100,23.0 L99,23.0 L98,23.1 L97,23.1 L96,23.1 L95,23.2 L94,23.2 L93,23.2 L92,23.3 L91,23.4 L90,23.5 L89,23.5 L88,23.5 L87,23.5 L86,23.4 L85,23.3 L84,23.3 L83,23.3 L82,23.3 L81,23.4 L80,23.4 L79,23.5 L78,23.6 L77,23.8 L76,24.0 L75,24.1 L74,24.1 L73,24.0 L72,24.0 L71,24.0 L70,23.9 L69,24.0 L68,24.1 L67,24.3 L66,24.5 L65,24.5 L64,24.4 L63,24.3 L62,24.3 L61,24.4 L60,24.4 L59,24.6 L58,24.6 L57,24.8 L56,25.2 L55,25.6 L54,25.8 L53,25.8 L52,26.0 L51,25.9 L50,26.0 L49,26.4 L48,26.6 L47,26.7 L46,26.6 L45,27.0 L44,27.0 L43,27.1 L42,27.2 L41,27.3 L40,28.0 L39,28.8 L38,29.0 L37,29.2 L36,28.5 L35,28.9 L34,28.4 L33,28.4 L32,28.2 L31,28.0 L30,28.5 L29,29.0 L28,28.5 L27,28.5 L26,29.3 L25,30.5 L24,31.0 L23,31.7 L22,31.8 L21,30.9 L20,32.0 L19,32.2 L18,31.9 L17,31.7 L16,31.6 L15,31.8 L14,33.9 L13,34.5 L12,33.6 L11,33.4 L10,34.2 L9,35.0 L8,35.8 L7,34.6 L6,35.8 L5,36.2 L4,36.8 L3,36.6 L2,37.0 L1,37.6 L0,39.0 Z"/></svg>
              <div class="played" id="played"></div>
              <div class="marker" id="marker"></div>
              <div class="readout">C4 · 2 s</div>
            </div>
            <es-knob class="big" address="/start" label="Start" min="0" max="1.5" value="0" unit="s"></es-knob>
          </div>
        </section>
        <section aria-label="Envelope">
          <h2>Envelope</h2>
          <div class="row">
            <es-knob address="/attack" label="Attack" min="0.001" max="2" scale="exp" value="0.005" unit="s"></es-knob>
            <es-knob address="/release" label="Release" min="0.01" max="4" scale="exp" value="0.4" unit="s"></es-knob>
          </div>
        </section>
        <section aria-label="Output">
          <h2>Output</h2>
          <es-knob address="/volume" label="Volume" min="0" max="1" scale="db" value="0.5012" unit="db"></es-knob>
          <es-meter address="/level" label="Level" max="0.25"></es-meter>
        </section>
      </div>
      <div class="keybed">
        <es-keys label="Keys" low="36" high="96"></es-keys>
      </div>
    </div>
    <div class="cheek" aria-hidden="true"></div>
  </main>
</div>
<p class="status" id="status" role="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  // The marker follows the Start knob, over the recording's 2 s; what lies
  // before it is shaded, as notes skip it.
  const marker = document.getElementById("marker");
  const played = document.getElementById("played");
  const place = (start) => {
    const share = Math.min(Math.max(start / 2, 0), 1);
    marker.style.left = `calc(8px + ${share} * (100% - 18px))`;
    played.style.width = `calc(${share} * (100% - 16px))`;
  };
  const start = document.querySelector('es-knob[address="/start"]');
  start.addEventListener("input", (e) => place(e.detail.value));
  place(start.value);
  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
