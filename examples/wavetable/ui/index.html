<!doctype html>
<!-- wavetable's page: the drone synthesizer's panel. Oscillators: the pitch
     of the lowest of the three. Sweep: the LFO's rate, centre, and depth
     across the eight tables, whose screen marks where the sweep is. Output:
     the volume and the level. Each control starts at the value the piece
     gives its osc-in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wavetable</title>
<style>
  /* The synth kit: a panel between walnut cheeks. */
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #262422, #121110 70%);
    font: 13px/1.3 system-ui, sans-serif; color: #ece7dc;
  }
  .synth {
    --hue: #4fd1c5;
    display: grid; grid-template-columns: 26px auto 26px; border-radius: 8px; box-shadow: 0 28px 70px #000d;
  }
  .cheek { background: linear-gradient(90deg, #4a2c18, #7b4d2c 35%, #5c371e 70%, #3b2313); }
  .cheek:first-child { border-radius: 8px 0 0 8px; }
  .cheek:last-child { border-radius: 0 8px 8px 0; }
  .panel {
    padding: 18px 26px 24px; background: linear-gradient(#34322f, #24231f);
    box-shadow: inset 0 1px 0 #ffffff22, inset 0 -2px 0 #00000055;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
         padding-bottom: 12px; margin-bottom: 18px; border-bottom: 1px solid #ffffff1c; }
  .model { font: 800 24px/1 system-ui, sans-serif; letter-spacing: 0.24em; }
  .model span { color: var(--hue); }
  .maker { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #a39c8f; text-transform: uppercase; }
  .sections { display: flex; align-items: stretch; }
  .sections section { padding: 0 22px; border-left: 1px solid #ffffff14; display: grid; align-content: start; gap: 14px; }
  .sections section:first-child { padding-left: 0; border-left: 0; }
  .sections section:last-child { padding-right: 0; }
  h2 { margin: 0; font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.28em; color: var(--hue); text-transform: uppercase; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .synth es-knob {
    --es-knob-size: 58px; --es-accent: var(--hue); --es-surface: #1b1a18; --es-line: #4d4a45;
    --es-text: #ece7dc; --es-muted: #a39c8f; --es-font: 600 10px/1.3 system-ui, sans-serif;
    text-align: center; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .synth es-knob.big { --es-knob-size: 84px; }
  .synth es-knob::part(body) { fill: url(#knob); stroke: #000; stroke-width: 2; }
  .synth es-knob::part(pointer) { stroke: #f4efe4; }
  .synth es-knob::part(value) { color: #ece7dc; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .synth es-meter {
    --es-accent: var(--hue); --es-surface: #121110; --es-line: #4d4a45; --es-text: #f4efe4; --es-muted: #a39c8f;
    --es-meter-length: 120px; --es-meter-thickness: 8px; --es-font: 600 10px/1.3 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  /* The screen: the eight tables, and a marker where the sweep is. */
  .screen { position: relative; width: 268px; height: 60px; border-radius: 4px; background: #0b1414;
            box-shadow: inset 0 0 0 1px #000, inset 0 0 18px #4fd1c522; overflow: hidden; }
  .screen svg { position: absolute; inset: 6px 8px; width: calc(100% - 16px); height: calc(100% - 12px); }
  .screen path { fill: none; stroke: #4fd1c5aa; stroke-width: 1.4; }
  .marker { position: absolute; top: 0; bottom: 0; width: 2px; left: 8px; background: #f4efe4;
            box-shadow: 0 0 8px var(--hue); transition: left 80ms linear; }
  .status { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #8a857c; font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
  <defs><radialGradient id="knob" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#55524c"/><stop offset="0.6" stop-color="#2a2825"/><stop offset="1" stop-color="#151412"/>
  </radialGradient></defs>
</svg>
<main class="synth" aria-label="wavetable">
  <div class="cheek" aria-hidden="true"></div>
  <div class="panel">
    <header class="top">
      <div class="model">WAVE<span>TABLE</span></div>
      <div class="maker">Eight-table drone · espresso</div>
    </header>
    <div class="sections">
      <section aria-label="Oscillators">
        <h2>Oscillators</h2>
        <es-knob class="big" address="/pitch" label="Pitch" min="55" max="440" scale="exp" value="110" unit="hz"></es-knob>
      </section>
      <section aria-label="Sweep">
        <h2>Sweep</h2>
        <div class="screen" aria-hidden="true">
          <svg viewBox="0 0 320 40" preserveAspectRatio="none" id="tables"></svg>
          <div class="marker" id="marker"></div>
        </div>
        <div class="row">
          <es-knob address="/sweep/rate" label="Rate" min="0.01" max="2" scale="exp" value="0.1" unit="hz"></es-knob>
          <es-knob address="/sweep/centre" label="Centre" min="0" max="1" value="0.5" unit="%"></es-knob>
          <es-knob address="/sweep/depth" label="Depth" min="0" max="0.5" value="0.5" unit="%"></es-knob>
        </div>
      </section>
      <section aria-label="Output">
        <h2>Output</h2>
        <es-knob address="/volume" label="Volume" min="0" max="1" scale="db" value="0.1778" unit="db"></es-knob>
        <es-meter address="/level" label="Level" max="0.25"></es-meter>
      </section>
    </div>
  </div>
  <div class="cheek" aria-hidden="true"></div>
</main>
<p class="status" id="status" role="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  // The eight tables' shapes, from a sine through brighter saws to a hollow square, side by side.
  const shapes = [
    (x) => Math.sin(x),
    (x) => Math.sin(x) + 0.3 * Math.sin(2 * x),
    (x) => Math.sin(x) + 0.5 * Math.sin(2 * x) + 0.2 * Math.sin(3 * x),
    (x) => [1, 2, 3, 4, 5].reduce((s, k) => s + Math.sin(k * x) / k, 0),
    (x) => [1, 2, 3, 4, 5, 6, 7, 8].reduce((s, k) => s + Math.sin(k * x) / k, 0),
    (x) => [1, 3, 5].reduce((s, k) => s + Math.sin(k * x) / k, 0) + 0.3 * Math.sin(2 * x),
    (x) => [1, 3, 5, 7].reduce((s, k) => s + Math.sin(k * x) / k, 0),
    (x) => [1, 3, 5, 7, 9, 11].reduce((s, k) => s + Math.sin(k * x) / k, 0),
  ];
  const tables = document.getElementById("tables");
  shapes.forEach((shape, n) => {
    const points = [];
    for (let i = 0; i <= 40; ++i) {
      const x = (i / 40) * 2 * Math.PI;
      points.push(`${n * 40 + 2 + i * 0.9},${20 - 14 * shape(x) / 1.3}`);
    }
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M" + points.join(" L"));
    tables.append(path);
  });
  // The marker follows the sweep's position, 0 at the sine and 1 at the square.
  const marker = document.getElementById("marker");
  const place = (p) => { marker.style.left = `calc(8px + ${Math.min(Math.max(p, 0), 1)} * (100% - 18px))`; };
  place(0.5);
  espresso.on("/position", place);
  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
