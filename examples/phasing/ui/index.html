<!doctype html>
<!-- phasing's page: the loops' panel above a reverb pedal. Pattern: the
     tempo, the phasing (how much faster the right marimba runs), and the
     fill (which steps of the pattern play); phasing and fill also follow
     wheels A and B, the higher counting. The screen shows the twelve steps,
     each with the held note it plays, the steps the fill has joined, and
     where each marimba is. Pad: its cutoff, resonance, attack, and release.
     Breath: the swell's rate and depth. Mix: the marimbas' and the pad's
     levels, and the level. The keyboard holds the loops' notes. The pedal:
     the reverb's mix and damping, and a footswitch that silences its
     return. Each control starts at the value the piece gives its osc-in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phasing</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #262422, #121110 70%);
    font: 13px/1.3 system-ui, sans-serif; color: #ece7dc;
  }
  .rig { display: grid; justify-items: center; gap: 16px; }

  /* The synth kit: a panel between walnut cheeks. */
  .synth {
    --hue: #a78bfa;
    display: grid; grid-template-columns: 26px auto 26px; border-radius: 8px; box-shadow: 0 28px 70px #000d;
  }
  .cheek { background: linear-gradient(90deg, #4a2c18, #7b4d2c 35%, #5c371e 70%, #3b2313); }
  .cheek:first-child { border-radius: 8px 0 0 8px; }
  .cheek:last-child { border-radius: 0 8px 8px 0; }
  .panel {
    padding: 16px 26px 20px; background: linear-gradient(#34322f, #24231f);
    box-shadow: inset 0 1px 0 #ffffff22, inset 0 -2px 0 #00000055;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
         padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid #ffffff1c; }
  .model { font: 800 24px/1 system-ui, sans-serif; letter-spacing: 0.24em; }
  .model span { color: var(--hue); }
  .maker { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #a39c8f; text-transform: uppercase; }
  .sections { display: flex; align-items: stretch; }
  .sections section { padding: 0 22px; border-left: 1px solid #ffffff14; display: grid; align-content: start; gap: 14px; }
  .sections section:first-child { padding-left: 0; border-left: 0; }
  .sections section:last-child { padding-right: 0; }
  h2 { margin: 0; font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.28em; color: var(--hue); text-transform: uppercase; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .synth es-knob {
    --es-knob-size: 58px; --es-accent: var(--hue); --es-surface: #1b1a18; --es-line: #4d4a45;
    --es-text: #ece7dc; --es-muted: #a39c8f; --es-font: 600 10px/1.3 system-ui, sans-serif;
    text-align: center; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .synth es-knob.big { --es-knob-size: 84px; }
  .synth es-knob::part(body) { fill: url(#knob); stroke: #000; stroke-width: 2; }
  .synth es-knob::part(pointer) { stroke: #f4efe4; }
  .synth es-knob::part(value) { color: #ece7dc; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .synth es-meter {
    --es-accent: var(--hue); --es-surface: #121110; --es-line: #4d4a45; --es-text: #f4efe4; --es-muted: #a39c8f;
    --es-meter-length: 120px; --es-meter-thickness: 8px; --es-font: 600 10px/1.3 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  /* The screen: the twelve steps, a row for each marimba. */
  .screen { display: grid; gap: 5px; width: 268px; padding: 8px 10px; box-sizing: border-box; border-radius: 4px;
            background: #100c18; box-shadow: inset 0 0 0 1px #000, inset 0 0 18px #a78bfa22; }
  .track { display: grid; grid-template-columns: 14px repeat(12, 1fr); gap: 3px; align-items: center; }
  .track b { font: 700 8px/1 system-ui, sans-serif; color: #a78bfacc; letter-spacing: 0.1em; }
  .cell { height: 16px; border-radius: 2px; display: grid; place-items: center; background: #a78bfa1f;
          font: 600 9px/1 system-ui, sans-serif; color: #a78bfacc; transition: background 60ms linear; }
  .cell.out { background: #ffffff08; color: #ffffff30; }
  .cell.now { background: var(--hue); color: #100c18; box-shadow: 0 0 8px var(--hue); }
  .track.right .cell.now { background: #e9e2ff; box-shadow: 0 0 8px #e9e2ff; }
  .grid2 { display: grid; grid-template-columns: repeat(2, auto); gap: 8px 16px; }
  .column { display: grid; gap: 8px; }
  /* The keyboard, set into the panel below the sections. */
  .keybed { margin-top: 14px; padding: 8px 8px 0; border-radius: 4px; background: #121110;
            box-shadow: inset 0 2px 6px #000c; }
  .synth es-keys { --es-keys-height: 86px; --es-accent: var(--hue); --es-line: #00000080;
                   --es-key-white: #efe9dc; --es-key-black: #171614; }

  /* The pedal kit: stompboxes on a pedalboard. */
  .board {
    display: flex; gap: 32px; padding: 16px 40px; border-radius: 12px;
    background: repeating-linear-gradient(90deg, #1d1d1f 0 3px, #202022 3px 6px);
    box-shadow: inset 0 0 0 1px #ffffff0d, 0 24px 60px #000c;
  }
  .pedal {
    position: relative; min-width: 160px; padding: 16px 20px 16px; border-radius: 16px;
    display: grid; justify-items: center; align-content: space-between; gap: 7px;
    background: linear-gradient(160deg, var(--paint-light), var(--paint) 40%, var(--paint-dark));
    box-shadow: inset 0 2px 0 #ffffff55, inset 0 -4px 0 #00000066, 0 14px 26px #000000aa;
  }
  .pedal.reverb { --paint: #9a86d6; --paint-light: #c7b8f2; --paint-dark: #5f4c9c; --ink: #1a1030; }
  /* Four screws in the corners. */
  .pedal::before, .pedal::after, .screws::before, .screws::after {
    content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f2f2f2, #8a8a8a 60%, #4a4a4a);
    box-shadow: 0 1px 1px #0008;
  }
  .pedal::before { top: 9px; left: 9px; }
  .pedal::after { top: 9px; right: 9px; }
  .screws::before { bottom: 9px; left: 9px; }
  .screws::after { bottom: 9px; right: 9px; }
  .knobs { display: flex; gap: 18px; }
  .pedal es-knob {
    --es-knob-size: 58px; --es-accent: #f3efe2; --es-surface: #f3efe2; --es-line: #00000040;
    --es-text: var(--ink); --es-muted: var(--ink); --es-font: 700 10px/1.2 system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: 0.12em; text-align: center;
  }
  .pedal es-knob::part(body) { stroke: #00000055; stroke-width: 2; filter: drop-shadow(0 2px 2px #0007); }
  .pedal es-knob::part(pointer) { stroke: #1a1a1a; stroke-width: 5; }
  .pedal es-knob::part(fill) { stroke: #ffffffb0; }
  .pedal es-knob::part(value) { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; }
  .name { text-align: center; color: var(--ink); }
  .name strong { display: block; font: 900 28px/1 system-ui, sans-serif; letter-spacing: 0.08em; }
  .name small { font: 700 10px/1.6 system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.8; }
  .pedal es-lamp { --es-lamp-size: 12px; --es-accent: #ff3b30; --es-surface: #4a1210; --es-line: #00000080; }
  .pedal es-lamp::part(label) { display: none; }
  /* The footswitch: the toggle drawn as a chrome button, its thumb hidden. */
  .pedal es-toggle { --es-toggle-length: 50px; --es-toggle-thickness: 50px; --es-accent: transparent; --es-line: transparent; }
  .pedal es-toggle::part(label) { display: none; }
  .pedal es-toggle::part(track) {
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffffff, #b9bcc0 35%, #6b6f74 70%, #3a3d41);
    box-shadow: 0 0 0 6px #2b2d30, 0 0 0 7px #00000088, 0 6px 10px #000a;
  }
  .pedal es-toggle::part(track on) { transform: translateY(2px); box-shadow: 0 0 0 6px #2b2d30, 0 0 0 7px #00000088, 0 2px 4px #000a; }
  .pedal es-toggle::part(thumb) { display: none; }
  .jack { position: absolute; top: 46%; width: 10px; height: 26px; background: linear-gradient(#5a5a5a, #2a2a2a); }
  .jack.in { right: -10px; border-radius: 0 3px 3px 0; }
  .jack.out { left: -10px; border-radius: 3px 0 0 3px; }
  .status { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #8a857c; font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
  <defs><radialGradient id="knob" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#55524c"/><stop offset="0.6" stop-color="#2a2825"/><stop offset="1" stop-color="#151412"/>
  </radialGradient></defs>
</svg>
<div class="rig">
  <main class="synth" aria-label="phasing">
    <div class="cheek" aria-hidden="true"></div>
    <div class="panel">
      <header class="top">
        <div class="model">PHASE<span>LOOPS</span></div>
        <div class="maker">Two marimbas · twelve steps · espresso</div>
      </header>
      <div class="sections">
        <section aria-label="Pattern">
          <h2>Pattern</h2>
          <div class="screen" id="pattern" aria-hidden="true"></div>
          <div class="row">
            <es-knob class="big" address="/tempo" label="Tempo" min="3.2" max="13.2" value="6.6" unit="bpm"></es-knob>
            <es-knob address="/phasing" label="Phasing" min="0" max="1" value="0" unit="phasing"></es-knob>
            <es-knob address="/fill" label="Fill" min="0" max="1" value="0" unit="%"></es-knob>
          </div>
        </section>
        <section aria-label="Pad">
          <h2>Pad</h2>
          <div class="grid2">
            <es-knob address="/pad/cutoff" label="Cutoff" min="100" max="4000" scale="exp" value="700" unit="hz"></es-knob>
            <es-knob address="/pad/resonance" label="Resonance" min="0" max="1" value="0.2" unit="%"></es-knob>
            <es-knob address="/pad/attack" label="Attack" min="0.005" max="4" scale="exp" value="0.15" unit="s"></es-knob>
            <es-knob address="/pad/release" label="Release" min="0.05" max="8" scale="exp" value="1.2" unit="s"></es-knob>
          </div>
        </section>
        <section aria-label="Breath">
          <h2>Breath</h2>
          <div class="column">
            <es-knob address="/breath/rate" label="Rate" min="0.01" max="1" scale="exp" value="0.07" unit="hz"></es-knob>
            <es-knob address="/breath/depth" label="Depth" min="0" max="0.65" value="0.35" unit="%"></es-knob>
          </div>
        </section>
        <section aria-label="Mix">
          <h2>Mix</h2>
          <div class="row">
            <es-knob address="/marimbas" label="Marimbas" min="0" max="1" scale="db" value="0.3162" unit="db"></es-knob>
            <es-knob address="/pad/level" label="Pad" min="0" max="1" scale="db" value="0.1" unit="db"></es-knob>
          </div>
          <es-meter address="/level" label="Level" max="0.25"></es-meter>
        </section>
      </div>
      <div class="keybed">
        <es-keys label="Keys" low="48" high="84"></es-keys>
      </div>
    </div>
    <div class="cheek" aria-hidden="true"></div>
  </main>

  <div class="board" aria-label="Pedalboard">
    <section class="pedal reverb" aria-label="Reverb pedal">
      <span class="screws" aria-hidden="true"></span>
      <span class="jack in" aria-hidden="true"></span><span class="jack out" aria-hidden="true"></span>
      <div class="knobs">
        <es-knob address="/reverb/mix" label="Mix" min="0" max="1" value="1" unit="%"></es-knob>
        <es-knob address="/reverb/damping" label="Damping" min="0" max="1" value="0.2" unit="%"></es-knob>
      </div>
      <es-lamp label="On"></es-lamp>
      <div class="name"><strong>REVERB</strong><small>send · schroeder</small></div>
      <es-toggle address="/reverb/on" label="Reverb on" value="1"></es-toggle>
    </section>
  </div>
</div>
<p class="status" id="status" role="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  // Sixteenths: four steps a beat.
  espressoUI.units.bpm = (rate) => `${Math.round(rate * 15)} BPM`;
  // The right marimba runs up to 3% faster than the left.
  espressoUI.units.phasing = (w) => `+${(w * 3).toFixed(2)}%`;

  // The pattern, as in loops.lisp: each step's held note (from 0), octave,
  // and the fill at which it joins.
  const pattern = [[0, 0, 0], [1, 0, 0.5], [2, 0, 0.2], [3, 0, 0.75], [1, 0, 0.1], [4, 0, 0.6],
                   [0, 1, 0.3], [3, 0, 0.85], [2, 0, 0.15], [1, 0, 0.65], [4, 0, 0.4], [3, -1, 0.95]];
  const screen = document.getElementById("pattern");
  const rows = ["left", "right"].map((side) => {
    const track = document.createElement("div");
    track.className = `track ${side}`;
    track.innerHTML = `<b>${side === "left" ? "L" : "R"}</b>`;
    const cells = pattern.map(([note, octave]) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = `${note + 1}${octave > 0 ? "↑" : octave < 0 ? "↓" : ""}`;
      track.append(cell);
      return cell;
    });
    screen.append(track);
    return cells;
  });
  // A step sounds once the fill reaches its entry.
  const fill = (f) => rows.forEach((cells) => cells.forEach((cell, k) => cell.classList.toggle("out", f < pattern[k][2])));
  fill(0);
  espresso.on("/fill/now", fill);
  // Each marimba's step, 0 to 11.
  rows.forEach((cells, side) => {
    let now = -1;
    const place = (step) => {
      if (now >= 0) cells[now].classList.remove("now");
      now = Math.round(step) % 12;
      cells[now].classList.add("now");
    };
    place(0);
    espresso.on(side === 0 ? "/step/left" : "/step/right", place);
  });

  // The LED is lit while the footswitch engages the reverb.
  document.querySelectorAll(".pedal").forEach((pedal) => {
    const lamp = pedal.querySelector("es-lamp");
    const footswitch = pedal.querySelector("es-toggle");
    footswitch.addEventListener("input", (e) => { lamp.value = e.detail.value; });
    lamp.value = footswitch.value;
  });

  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
