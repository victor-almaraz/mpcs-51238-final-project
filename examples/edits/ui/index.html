<!doctype html>
<!-- edits' page: the string synthesizer's panel, and its reverb pedal on a
     pedalboard below it. Stream: the edits a second, the last edit's size
     in bytes, and a light at each edit. Strings: the volume, and the
     velocity the last edit played. Output: the level. The Hall pedal: the
     reverb's mix, and a footswitch that bypasses it, lit while engaged.
     Each control starts at the value the piece gives its osc-in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edits</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; background: radial-gradient(circle at 50% 30%, #262422, #121110 70%);
    font: 13px/1.3 system-ui, sans-serif; color: #ece7dc;
  }

  /* The synth kit: a panel between walnut cheeks. */
  .synth {
    --hue: #b48cf2;
    display: grid; grid-template-columns: 26px auto 26px; border-radius: 8px; box-shadow: 0 28px 70px #000d;
  }
  .cheek { background: linear-gradient(90deg, #4a2c18, #7b4d2c 35%, #5c371e 70%, #3b2313); }
  .cheek:first-child { border-radius: 8px 0 0 8px; }
  .cheek:last-child { border-radius: 0 8px 8px 0; }
  .panel {
    padding: 18px 26px 24px; background: linear-gradient(#34322f, #24231f);
    box-shadow: inset 0 1px 0 #ffffff22, inset 0 -2px 0 #00000055;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
         padding-bottom: 12px; margin-bottom: 18px; border-bottom: 1px solid #ffffff1c; }
  .model { font: 800 24px/1 system-ui, sans-serif; letter-spacing: 0.24em; }
  .model span { color: var(--hue); }
  .maker { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #a39c8f; text-transform: uppercase; }
  .sections { display: flex; align-items: stretch; }
  .sections section { padding: 0 22px; border-left: 1px solid #ffffff14; display: grid; align-content: start; gap: 14px; }
  .sections section:first-child { padding-left: 0; border-left: 0; }
  .sections section:last-child { padding-right: 0; }
  h2 { margin: 0; font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.28em; color: var(--hue); text-transform: uppercase; }
  .synth es-knob {
    --es-knob-size: 58px; --es-accent: var(--hue); --es-surface: #1b1a18; --es-line: #4d4a45;
    --es-text: #ece7dc; --es-muted: #a39c8f; --es-font: 600 10px/1.3 system-ui, sans-serif;
    text-align: center; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .synth es-knob.big { --es-knob-size: 84px; }
  .synth es-knob::part(body) { fill: url(#knob); stroke: #000; stroke-width: 2; }
  .synth es-knob::part(pointer) { stroke: #f4efe4; }
  .synth es-knob::part(value) { color: #ece7dc; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .synth es-meter {
    --es-accent: var(--hue); --es-surface: #121110; --es-line: #4d4a45; --es-text: #f4efe4; --es-muted: #a39c8f;
    --es-meter-length: 120px; --es-meter-thickness: 8px; --es-font: 600 10px/1.3 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .synth es-lamp { --es-lamp-size: 10px; --es-accent: var(--hue); --es-surface: #1d1a24; --es-line: #000; }
  .synth es-lamp::part(label) { display: none; }

  /* The screen: the stream's rate, large, and the last edit under it. */
  .screen { position: relative; width: 268px; height: 92px; box-sizing: border-box; padding: 10px 14px;
            border-radius: 4px; background: #110d18; box-shadow: inset 0 0 0 1px #000, inset 0 0 18px #b48cf222;
            display: grid; grid-template-columns: 1fr auto; align-content: space-between;
            font-variant-numeric: tabular-nums; color: #dccbfa; }
  .screen .rate { font: 300 38px/1 system-ui, sans-serif; letter-spacing: 0.02em; }
  .screen .rate small { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.2em; color: #a58fcf; margin-left: 6px; }
  .screen .last { grid-column: 1 / -1; display: flex; justify-content: space-between;
                  font: 500 11px/1 system-ui, sans-serif; color: #a58fcf; letter-spacing: 0.06em; }
  .screen .last b { color: #dccbfa; font-weight: 600; }

  /* The pedal kit: a stompbox on a pedalboard. */
  .board {
    display: flex; gap: 32px; padding: 26px 44px; border-radius: 12px;
    background: repeating-linear-gradient(90deg, #1d1d1f 0 3px, #202022 3px 6px);
    box-shadow: inset 0 0 0 1px #ffffff0d, 0 24px 60px #000c;
  }
  .pedal {
    --paint: #3d8a5f; --paint-light: #6cc08e; --paint-dark: #245a3c; --ink: #0c2a1a;
    position: relative; width: 196px; padding: 20px 20px 24px; border-radius: 16px; box-sizing: border-box;
    display: grid; justify-items: center; gap: 14px;
    background: linear-gradient(160deg, var(--paint-light), var(--paint) 40%, var(--paint-dark));
    box-shadow: inset 0 2px 0 #ffffff55, inset 0 -4px 0 #00000066, 0 14px 26px #000000aa;
  }
  /* Four screws in the corners. */
  .pedal::before, .pedal::after, .screws::before, .screws::after {
    content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f2f2f2, #8a8a8a 60%, #4a4a4a);
    box-shadow: 0 1px 1px #0008;
  }
  .pedal::before { top: 9px; left: 9px; }
  .pedal::after { top: 9px; right: 9px; }
  .screws::before { bottom: 9px; left: 9px; }
  .screws::after { bottom: 9px; right: 9px; }
  .pedal es-knob {
    --es-knob-size: 58px; --es-accent: #f3efe2; --es-surface: #f3efe2; --es-line: #00000040;
    --es-text: var(--ink); --es-muted: var(--ink); --es-font: 700 10px/1.2 system-ui, sans-serif;
    text-transform: uppercase; letter-spacing: 0.12em; text-align: center;
  }
  .pedal es-knob::part(body) { stroke: #00000055; stroke-width: 2; filter: drop-shadow(0 2px 2px #0007); }
  .pedal es-knob::part(pointer) { stroke: #1a1a1a; stroke-width: 5; }
  .pedal es-knob::part(fill) { stroke: #ffffffb0; }
  .pedal es-knob::part(value) { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; }
  .name { text-align: center; color: var(--ink); }
  .name strong { display: block; font: 900 30px/1 system-ui, sans-serif; letter-spacing: 0.08em; }
  .name small { font: 700 10px/1.6 system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.8; }
  .pedal es-lamp { --es-lamp-size: 12px; --es-accent: #ff3b30; --es-surface: #4a1210; --es-line: #00000080; }
  .pedal es-lamp::part(label) { display: none; }
  /* The footswitch: the toggle drawn as a chrome button, its thumb hidden. */
  .pedal es-toggle { --es-toggle-length: 64px; --es-toggle-thickness: 64px; --es-accent: transparent; --es-line: transparent; }
  .pedal es-toggle::part(label) { display: none; }
  .pedal es-toggle::part(track) {
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffffff, #b9bcc0 35%, #6b6f74 70%, #3a3d41);
    box-shadow: 0 0 0 6px #2b2d30, 0 0 0 7px #00000088, 0 6px 10px #000a;
  }
  .pedal es-toggle::part(track on) { transform: translateY(2px); box-shadow: 0 0 0 6px #2b2d30, 0 0 0 7px #00000088, 0 2px 4px #000a; }
  .pedal es-toggle::part(thumb) { display: none; }
  .jack { position: absolute; top: 46%; width: 10px; height: 26px; background: linear-gradient(#5a5a5a, #2a2a2a); }
  .jack.in { right: -10px; border-radius: 0 3px 3px 0; }
  .jack.out { left: -10px; border-radius: 3px 0 0 3px; }
  .status { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #8a857c; font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
  <defs><radialGradient id="knob" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#55524c"/><stop offset="0.6" stop-color="#2a2825"/><stop offset="1" stop-color="#151412"/>
  </radialGradient></defs>
</svg>
<main class="synth" aria-label="edits">
  <div class="cheek" aria-hidden="true"></div>
  <div class="panel">
    <header class="top">
      <div class="model">RECENT<span>CHANGES</span></div>
      <div class="maker">Twelve-string pluck · Wikimedia stream</div>
    </header>
    <div class="sections">
      <section aria-label="Stream">
        <h2>Stream</h2>
        <div class="screen" role="group" aria-label="Edits">
          <div class="rate"><span id="rate">–</span><small>EDITS / S</small></div>
          <es-lamp id="edit" label="Edit"></es-lamp>
          <div class="last"><span>Last edit</span><b id="size">–</b></div>
        </div>
      </section>
      <section aria-label="Strings">
        <h2>Strings</h2>
        <es-knob class="big" address="/volume" label="Volume" min="0" max="1" scale="db" value="0.1995" unit="db"></es-knob>
        <es-meter id="velocity" label="Velocity" max="1" hold="0"></es-meter>
      </section>
      <section aria-label="Output">
        <h2>Output</h2>
        <es-meter address="/level" label="Level" max="0.25"></es-meter>
      </section>
    </div>
  </div>
  <div class="cheek" aria-hidden="true"></div>
</main>
<section class="board" aria-label="Pedalboard">
  <section class="pedal" aria-label="Hall reverb pedal">
    <span class="screws" aria-hidden="true"></span>
    <span class="jack in" aria-hidden="true"></span><span class="jack out" aria-hidden="true"></span>
    <es-knob address="/hall/mix" label="Mix" min="0" max="1" value="0.3" unit="%"></es-knob>
    <es-lamp id="hall-lamp" label="On"></es-lamp>
    <div class="name"><strong>HALL</strong><small>reverb</small></div>
    <es-toggle id="hall" address="/hall/on" label="Hall" value="1"></es-toggle>
  </section>
</section>
<p class="status" id="status" role="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  // The edits a second, over the last 5 s: the piece counts edits from 1 to
  // 8, and each message adds the edits since the last.
  const arrivals = [];
  let count = null;  // unknown until the first message
  const lamp = document.getElementById("edit");
  let dark = null;
  espresso.on("/edits", (n) => {
    if (count !== null) arrivals.push([performance.now(), (n - count + 8) % 8 || 8]);
    count = n;
    lamp.value = 1;
    clearTimeout(dark);
    dark = setTimeout(() => { lamp.value = 0; }, 60);
  });
  setInterval(() => {
    const now = performance.now();
    while (arrivals.length > 0 && arrivals[0][0] < now - 5000) arrivals.shift();
    const edits = arrivals.reduce((sum, a) => sum + a[1], 0);
    document.getElementById("rate").textContent = arrivals.length > 0 ? (edits / 5).toFixed(1) : "–";
  }, 500);
  // The last edit's size, and the velocity the piece plays it at: its log
  // from 4 to 12 over 0.15 to 1.
  const velocity = document.getElementById("velocity");
  espresso.on("/size", (n) => {
    document.getElementById("size").textContent = Math.round(n).toLocaleString("en-US") + " bytes";
    const v = 0.15 + ((Math.log(n + 1) - 4) / 8) * 0.85;
    velocity.value = Math.min(Math.max(v, 0.15), 1);
  });
  // The pedal's LED is lit while its footswitch engages it.
  const hall = document.getElementById("hall");
  hall.addEventListener("input", (e) => { document.getElementById("hall-lamp").value = e.detail.value; });
  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
