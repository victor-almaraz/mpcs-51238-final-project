<!doctype html>
<!-- grain-cloud's page: the granulator's panel. Scan: the rate, centre, and
     depth of the LFO that moves where the grains read, over a screen of the
     glass recording that shades the scanned span and marks where the grains
     are. Density: the rate, centre, and depth of the LFO that sets how many
     grains start each second, and the count it reaches. Grains: each grain's
     length, timing jitter, pitch jitter, reverse chance, and stereo spread.
     Output: the volume and the level. Each control starts at the value the
     piece gives its osc-in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grain-cloud</title>
<style>
  /* The synth kit: a panel between walnut cheeks. */
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #262422, #121110 70%);
    font: 13px/1.3 system-ui, sans-serif; color: #ece7dc;
  }
  .synth {
    --hue: #b39dff;
    display: grid; grid-template-columns: 26px auto 26px; border-radius: 8px; box-shadow: 0 28px 70px #000d;
  }
  .cheek { background: linear-gradient(90deg, #4a2c18, #7b4d2c 35%, #5c371e 70%, #3b2313); }
  .cheek:first-child { border-radius: 8px 0 0 8px; }
  .cheek:last-child { border-radius: 0 8px 8px 0; }
  .panel {
    padding: 18px 26px 24px; background: linear-gradient(#34322f, #24231f);
    box-shadow: inset 0 1px 0 #ffffff22, inset 0 -2px 0 #00000055;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
         padding-bottom: 12px; margin-bottom: 18px; border-bottom: 1px solid #ffffff1c; }
  .model { font: 800 24px/1 system-ui, sans-serif; letter-spacing: 0.24em; }
  .model span { color: var(--hue); }
  .maker { font: 600 10px/1 system-ui, sans-serif; letter-spacing: 0.32em; color: #a39c8f; text-transform: uppercase; }
  .sections { display: flex; align-items: stretch; }
  .sections section { padding: 0 22px; border-left: 1px solid #ffffff14; display: grid; align-content: start; gap: 14px; }
  .sections section:first-child { padding-left: 0; border-left: 0; }
  .sections section:last-child { padding-right: 0; }
  h2 { margin: 0; font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.28em; color: var(--hue); text-transform: uppercase; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .grid { display: grid; grid-template-columns: repeat(3, auto); gap: 12px 16px; align-items: end; }
  .synth es-knob {
    --es-knob-size: 58px; --es-accent: var(--hue); --es-surface: #1b1a18; --es-line: #4d4a45;
    --es-text: #ece7dc; --es-muted: #a39c8f; --es-font: 600 10px/1.3 system-ui, sans-serif;
    text-align: center; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .synth es-knob.big { --es-knob-size: 84px; }
  .synth es-knob::part(body) { fill: url(#knob); stroke: #000; stroke-width: 2; }
  .synth es-knob::part(pointer) { stroke: #f4efe4; }
  .synth es-knob::part(value) { color: #ece7dc; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .synth es-meter {
    --es-accent: var(--hue); --es-surface: #121110; --es-line: #4d4a45; --es-text: #f4efe4; --es-muted: #a39c8f;
    --es-meter-length: 120px; --es-meter-thickness: 8px; --es-font: 600 10px/1.3 system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  /* The screens: the recording with the scanned span and the read head,
     and the density's readout. */
  .screen { position: relative; border-radius: 4px; background: #110e1a;
            box-shadow: inset 0 0 0 1px #000, inset 0 0 18px #b39dff22; overflow: hidden; }
  .scan { width: 222px; height: 60px; }
  .scan svg { position: absolute; inset: 6px 8px; width: calc(100% - 16px); height: calc(100% - 12px); }
  .scan path { fill: #b39dff55; stroke: #b39dffaa; stroke-width: 0.6; }
  .span { position: absolute; top: 0; bottom: 0; background: #b39dff1f; border-left: 1px solid #b39dff66;
          border-right: 1px solid #b39dff66; }
  .marker { position: absolute; top: 0; bottom: 0; width: 2px; left: 8px; background: #f4efe4;
            box-shadow: 0 0 8px var(--hue); transition: left 80ms linear; }
  .readout { width: 206px; height: 60px; display: grid; place-content: center; text-align: center; }
  .readout es-value { --es-text: #e6dcff; --es-muted: #8c82a8; --es-font: 600 9px/1.2 system-ui, sans-serif;
                      letter-spacing: 0.2em; text-transform: uppercase; }
  .readout es-value::part(value) { font: 500 24px/1.1 ui-monospace, monospace; letter-spacing: 0; text-transform: none; color: #e6dcff;
                                   text-shadow: 0 0 8px #b39dff88; }
  .status { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: #8a857c; font-size: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
  <defs><radialGradient id="knob" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#55524c"/><stop offset="0.6" stop-color="#2a2825"/><stop offset="1" stop-color="#151412"/>
  </radialGradient></defs>
</svg>
<main class="synth" aria-label="grain-cloud">
  <div class="cheek" aria-hidden="true"></div>
  <div class="panel">
    <header class="top">
      <div class="model">GRAIN<span>CLOUD</span></div>
      <div class="maker">Granular glass · espresso</div>
    </header>
    <div class="sections">
      <section aria-label="Scan">
        <h2>Scan</h2>
        <div class="screen scan" aria-hidden="true">
          <svg viewBox="0 0 120 40" preserveAspectRatio="none"><path id="glass"></path></svg>
          <div class="span" id="span"></div>
          <div class="marker" id="marker"></div>
        </div>
        <div class="row">
          <es-knob address="/scan/rate" label="Rate" min="0.01" max="1" scale="exp" value="0.05" unit="hz"></es-knob>
          <es-knob address="/scan/centre" label="Centre" min="0" max="3" value="1.5" unit="s"></es-knob>
          <es-knob address="/scan/depth" label="Depth" min="0" max="1.5" value="1.2" unit="s"></es-knob>
        </div>
      </section>
      <section aria-label="Density">
        <h2>Density</h2>
        <div class="screen readout">
          <es-value address="/rate" label="Grains a second" unit="grains"></es-value>
        </div>
        <div class="row">
          <es-knob address="/density/rate" label="Rate" min="0.01" max="2" scale="exp" value="0.13" unit="hz"></es-knob>
          <es-knob address="/density/centre" label="Centre" min="1" max="100" scale="exp" value="18" unit="hz"></es-knob>
          <es-knob address="/density/depth" label="Depth" min="0" max="40" value="12" unit="hz"></es-knob>
        </div>
      </section>
      <section aria-label="Grains">
        <h2>Grains</h2>
        <es-knob class="big" address="/grain" label="Length" min="0.01" max="0.5" scale="exp" value="0.15" unit="s"></es-knob>
        <div class="grid">
          <es-knob address="/jitter" label="Jitter" min="0" max="0.3" value="0.08" unit="s"></es-knob>
          <es-knob address="/pitch-jitter" label="Pitch" min="0" max="4" value="0.3" unit="st"></es-knob>
          <es-knob address="/reverse" label="Reverse" min="0" max="1" value="0.2" unit="%"></es-knob>
        </div>
      </section>
      <section aria-label="Output">
        <h2>Output</h2>
        <es-knob address="/spread" label="Spread" min="0" max="1" value="0.8" unit="%"></es-knob>
        <es-knob address="/volume" label="Volume" min="0" max="1" scale="db" value="0.5" unit="db"></es-knob>
        <es-meter address="/level" label="Level" max="0.25"></es-meter>
      </section>
    </div>
  </div>
  <div class="cheek" aria-hidden="true"></div>
</main>
<p class="status" id="status" role="status">Connecting…</p>
<script src="/espresso.js"></script>
<script src="/espresso-ui.js"></script>
<script>
  espressoUI.units.st = (v) => `${v.toFixed(2)} st`;
  espressoUI.units.grains = (v) => String(Math.round(v));
  // The recording's peaks, 120 of them over its 3 s, mirrored about the centre line.
  const peaks = [0.59,0.58,0.53,0.49,0.46,0.47,0.48,0.45,0.44,0.42,0.39,0.37,0.36,0.36,0.36,0.35,0.55,0.53,0.54,0.55,
    0.53,0.51,0.48,0.43,0.41,0.40,0.41,0.41,0.39,0.39,0.36,0.34,0.40,0.37,0.37,0.37,0.36,0.34,0.33,0.29,0.27,0.26,
    0.27,0.26,0.25,0.25,0.23,0.21,0.73,0.65,0.64,0.59,0.54,0.61,0.54,0.54,0.48,0.49,0.49,0.49,0.49,0.43,0.45,0.40,
    0.72,0.85,0.76,0.76,0.73,0.63,0.63,0.68,0.57,0.61,0.56,0.52,0.62,0.53,0.52,0.48,0.60,0.63,0.61,0.64,0.64,0.49,
    0.52,0.53,0.51,0.58,0.49,0.44,0.44,0.45,0.47,0.43,0.82,0.73,0.85,0.68,0.68,0.72,0.70,0.68,0.64,0.57,0.57,0.61,
    0.56,0.59,0.45,0.47,1.00,0.89,0.76,0.81,0.77,0.80,0.68,0.73];
  const upper = peaks.map((p, i) => `${i + 0.5},${20 - 18 * p}`);
  const lower = peaks.map((p, i) => `${i + 0.5},${20 + 18 * p}`).reverse();
  document.getElementById("glass").setAttribute("d", `M${upper.join(" L")} L${lower.join(" L")} Z`);
  // A time in the recording, 0 to 3 s, as a place across the screen.
  const across = (t) => `calc(8px + ${Math.min(Math.max(t / 3, 0), 1)} * (100% - 18px))`;
  const marker = document.getElementById("marker");
  espresso.on("/position", (t) => { marker.style.left = across(t); });
  // The shaded span: the centre, less and more the depth.
  const centre = document.querySelector('[address="/scan/centre"]');
  const depth = document.querySelector('[address="/scan/depth"]');
  const span = document.getElementById("span");
  const shade = () => {
    span.style.left = across(centre.value - depth.value);
    span.style.right = `calc(100% - ${across(centre.value + depth.value)} - 2px)`;
  };
  for (const knob of [centre, depth]) knob.addEventListener("input", shade);
  // Until the piece sends them, the head and the count show the centres.
  addEventListener("DOMContentLoaded", () => {
    shade();
    marker.style.left = across(centre.value);
    document.querySelector('[address="/rate"]').value = document.querySelector('[address="/density/centre"]').value;
  });
  espresso.onOpen(() => { document.getElementById("status").textContent = "Connected"; });
</script>
</body>
</html>
